<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日简报 · Douyin-DB</title>
<link rel="stylesheet" href="/shell.css?v=1786286777">
<style>
/* 数值全部照高保真稿实测 */
.top{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.top h1{margin:0;font-size:26px;font-weight:600;color:var(--fg-hi);letter-spacing:-.5px}
.top h1 span{color:var(--fg-hi)}
.top .sub{margin-top:5px;font-size:12.5px;color:#626c7c}
.top .gap{flex:1}
/* 天数分段控件,和顶栏 tab 同一套语言 */
.days{display:flex;gap:2px;padding:3px;background:var(--surface);border-radius:9px;
  border:1px solid var(--line)}
.days button{background:none;border:0;border-radius:7px;padding:7px 14px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--dim)}
.days button.on{background:#232b36;color:var(--fg-hi)}
.pickbtn{background:#151a21;border:1px solid var(--line);border-radius:9px;padding:8px 14px;
  font-size:12px;font-weight:500;color:#c4cbd5;cursor:pointer;white-space:nowrap}
.pickbtn:hover{border-color:var(--line2)}

/* 按方面看 */
.aspects{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.aspects .lab{font-size:10px;font-weight:500;color:var(--dim2);letter-spacing:.8px;margin-right:2px}
.asp{background:var(--surface);border:0;border-radius:8px;padding:7px 13px;cursor:pointer;
  font-size:12px;font-weight:400;color:var(--dim)}
.asp.on{background:rgba(76,141,255,.15);color:var(--accent);font-weight:500}

/* 共识与分歧 */
.consensus{border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  background:var(--surface);margin-bottom:16px}
.consensus .hd{font-size:10px;font-weight:500;color:var(--dim2);letter-spacing:.6px;margin-bottom:9px}
.consensus .body{font-size:15px;line-height:1.75;color:#d5dae2}
.consensus .foot{margin-top:10px;font-size:11.5px;color:var(--dim2);line-height:1.6}

/* 博主卡 */
.who{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-bottom:14px}
.whohd{display:flex;align-items:center;gap:11px;padding:13px 16px;background:#0f1217;
  border-bottom:1px solid var(--line)}
.whohd .ava{width:30px;height:30px;border-radius:50%;background:#232b36;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim)}
.whohd .nm{font-size:15px;font-weight:600;line-height:1.35}
.whohd .meta{font-size:11.5px;color:#626c7c;margin-top:1px}
.whohd .fold{margin-left:auto;background:none;border:0;color:var(--accent);
  font-size:12px;cursor:pointer;white-space:nowrap;padding:4px}

.item{padding:15px 16px;border-top:1px solid var(--line)}
.who .item:first-of-type{border-top:0}
/* 只有文案 = 其实没内容,整块暖色底,和有内容的条目一眼分开 */
.item.thin{background:rgba(255,122,69,.04)}
.ihd{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.ihd .when{font-size:11px;color:var(--dim2)}
.pt{font-size:16.5px;font-weight:600;line-height:1.45;color:var(--fg-hi);margin:0}
.pbody{margin-top:7px;font-size:13.5px;line-height:1.8;color:#a8b0bd}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill2{background:#0f1217;border-radius:999px;padding:4px 11px;font-size:11px;color:var(--dim)}
/* 只有文案的条目:原文案带引号斜体,后面一句说清「这不是内容」 */
.raw{font-size:14px;line-height:1.7;color:#c4cbd5;font-style:italic}
.rawnote{margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--dim)}
.rawact{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.rawact .btn{border-color:var(--warn-line);color:var(--warn-text);background:rgba(255,122,69,.08);
  font-size:12px;font-weight:500;padding:8px 14px}
.rawact .btn:hover:not(:disabled){background:rgba(255,122,69,.16)}
.rawact .cost{font-size:11px;color:var(--dim2)}

.skel{color:var(--dim2);text-align:center;padding:60px 0;font-size:13px}
@media(max-width:720px){
  .top{flex-wrap:wrap}
  .top h1{font-size:21px}
}
</style>

<div class="wrap narrow">
  <div id="picker"></div>
  <div id="fetchbar"></div>
  <div id="body"><div class="skel">读取中…</div></div>
</div>

<script src="/shell.js?v=1786286777"></script>
<script>
'use strict';
mountNav('digest');

let DAYS = 3, ASPECT = '', DATA = null;
const CRED = {
  summary: {cls: 'summary', label: '抖音总结'},
  asr:     {cls: 'asr',     label: '本地转写'},
  desc:    {cls: 'desc',    label: '只有文案'},
};

/* 「今天是几号」用本地时间,不用服务器时间 —— 这是给人看的日期 */
function today() {
  const d = new Date();
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}

/* 按方面分桶:用官方一级分类。没有分类的归「其他」。 */
function bucketByAspect(creators) {
  const m = new Map();
  for (const c of creators) {
    // 一个博主的方面 = 他这批作品里最多的那个分类
    const tally = {};
    for (const i of c.items) {
      const k = i.cat1 || '其他';
      tally[k] = (tally[k] || 0) + 1;
    }
    const asp = Object.entries(tally).sort((a, b) => b[1] - a[1])[0]?.[0] || '其他';
    if (!m.has(asp)) m.set(asp, {aspect: asp, creators: [], n: 0});
    const b = m.get(asp);
    b.creators.push(c); b.n += c.items.length;
  }
  return [...m.values()].sort((a, b) => b.n - a.n);
}

function itemHtml(i) {
  const c = CRED[i.content_src] || CRED.desc;
  const when = (i.create_time || '').slice(5, 16).replace('-', '月').replace(' ', '日 ');
  const stats = [
    i.video_duration ? dur(i.video_duration) : null,
    i.digg_count != null ? fmt(i.digg_count) + ' 赞' : null,
    i.comment_count ? fmt(i.comment_count) + ' 评' : null,
  ].filter(Boolean).join(' · ');

  const head = `<div class="ihd"><span class="cred ${c.cls}">${c.label}</span>
    <span class="when">${esc(when)}${stats ? ' · ' + stats : ''}</span></div>`;

  if (i.content_src === 'desc') {
    // 只有文案:如实说这不是内容,并给出唯一能补救的动作
    return `<div class="item thin" data-id="${i.aweme_id}">
      ${head}
      <div class="raw">「${esc((i.content || i.description || '').slice(0, 90))}」</div>
      <div class="rawnote">这是他自己写的标题文案,不是他讲了什么。
        抖音没生成总结,本地也还没转写 —— <b>这条目前等于没有内容</b>。</div>
      <div class="rawact">
        <button class="btn" data-asr="${i.aweme_id}">加入本地转写队列</button>
        <span class="cost">${i.video_duration ? '约 ' + Math.round(i.video_duration / 1000 / 3) + ' 秒' : ''}
          · 全程在本机跑,不发给任何第三方</span>
      </div></div>`;
  }

  // 有内容:标题位放「观点」。没有 LLM 提炼时退回原标题,**不编**。
  const title = i.point || i.item_title || (i.description || '').slice(0, 40);
  return `<div class="item">
    ${head}
    <p class="pt">${i.point ? '观点:' : ''}${esc(title)}</p>
    <div class="pbody">${esc((i.content || '').slice(0, 260))}</div>
    ${(i.tags || []).length ? `<div class="pills">${
      i.tags.slice(0, 4).map(t => `<span class="pill2">${esc(t)}</span>`).join('')}</div>` : ''}
  </div>`;
}

function whoHtml(c, open) {
  const withContent = c.items.filter(i => i.content_src !== 'desc').length;
  return `<div class="who" data-who="${esc(c.sec_user_id)}">
    <div class="whohd">
      <div class="ava">${esc((c.nickname || '?').slice(0, 1))}</div>
      <div><div class="nm">${esc(c.nickname)}</div>
        <div class="meta">这几天 ${c.items.length} 条${
          withContent ? ` · ${withContent} 条能看到内容` : ' · 都还没有内容'}</div></div>
      <button class="fold">${open ? '收起 ▴' : '展开 ▾'}</button>
    </div>
    ${open ? c.items.map(itemHtml).join('') : ''}
  </div>`;
}

function render() {
  const info = DATA.info, ov = DATA.overview;
  const all = info.creators || [];
  const buckets = bucketByAspect(all);
  if (ASPECT && !buckets.some(b => b.aspect === ASPECT)) ASPECT = '';
  const shown = ASPECT ? buckets.find(b => b.aspect === ASPECT).creators : all;
  const nItems = shown.reduce((s, c) => s + c.items.length, 0);
  const nWithContent = shown.reduce((s, c) =>
    s + c.items.filter(i => i.content_src !== 'desc').length, 0);

  let html = `
    <div class="top">
      <div>
        <h1>${today()} · <span>最近 ${ov.days} 天</span></h1>
        <div class="sub">${shown.length} 位有价值博主 · ${nItems} 条新作品 ·
          ${nWithContent} 条能看到讲了什么</div>
      </div>
      <span class="gap"></span>
      <div class="days">
        ${[3, 7, 14].map(d => `<button class="${d === DAYS ? 'on' : ''}" data-days="${d}">${d} 天</button>`).join('')}
      </div>
      <button class="pickbtn" id="pick">挑博主 · 打标</button>
    </div>`;

  if (!all.length) {
    // 空的时候不能只说「没有」—— 那是死胡同。去查最近一条到底多久前,
    // 直接把答案给出来,并给一个能立刻用的动作。
    html += `<div class="empty" id="nothing"><b>这 ${ov.days} 天没有新内容</b>
      <span id="why">${ov.n_info ? '正在查最近一条是什么时候…' : '还没有标记「有价值」的博主 —— 先去挑几位。'}</span>
      <br><a class="btn" href="/creators.html">挑博主 · 打标 →</a></div>`;
    $('#body').innerHTML = html;
    wire();
    if (ov.n_info) probeLatest();
    return;
  }

  if (buckets.length > 1) {
    html += `<div class="aspects"><span class="lab">按方面看</span>
      <button class="asp${!ASPECT ? ' on' : ''}" data-asp="">全部 · ${all.length} 人 · ${
        all.reduce((s, c) => s + c.items.length, 0)} 条</button>
      ${buckets.map(b => `<button class="asp${ASPECT === b.aspect ? ' on' : ''}" data-asp="${esc(b.aspect)}">${
        esc(b.aspect)} · ${b.creators.length} 人 · ${b.n} 条</button>`).join('')}</div>`;
  }

  // 共识与分歧:需要 LLM 归纳。没有就诚实说「还没有」,不假装。
  const consensus = DATA.consensus;
  if (consensus && consensus.text) {
    html += `<div class="consensus">
      <div class="hd">${esc(ASPECT || '这几天')} · 共识与分歧</div>
      <div class="body">${esc(consensus.text)}</div>
      <div class="foot">这段是从下面这些作品的内容里归纳的,不是从标题猜的。
        只有文案、没有内容的作品不参与归纳。</div></div>`;
  } else if (nWithContent >= 2) {
    html += `<div class="consensus">
      <div class="hd">${esc(ASPECT || '这几天')} · 共识与分歧</div>
      <div class="body" style="color:var(--dim)">要归纳「谁和谁讲的是不是一回事」需要配一个语言模型
        (.env 里填 <code>DASHSCOPE_API_KEY</code>)。没配的时候这里空着 —— 与其编一段,
        不如让你直接看下面每条的原文。</div></div>`;
  }

  html += shown.map((c, i) => whoHtml(c, i === 0)).join('');
  $('#body').innerHTML = html;
  wire();
}

function wire() {
  $$('[data-days]').forEach(b => b.onclick = () => { DAYS = +b.dataset.days; load(); });
  $$('[data-asp]').forEach(b => b.onclick = () => { ASPECT = b.dataset.asp; render(); });
  const p = $('#pick');
  if (p) p.onclick = () => {
    // 页内展开,不跳走 —— 选人和看简报是同一件事的两半
    if ($('#picker').innerHTML) { $('#picker').innerHTML = ''; return; }
    mountPicker('#picker', 'info', () => { load(); });
  };
  $$('.who .fold').forEach(btn => btn.onclick = () => {
    const card = btn.closest('.who');
    const id = card.dataset.who;
    const c = (DATA.info.creators || []).find(x => x.sec_user_id === id);
    const isOpen = btn.textContent.includes('收起');
    card.outerHTML = whoHtml(c, !isOpen);
    wire();
  });
  $$('[data-asr]').forEach(btn => btn.onclick = async () => {
    btn.disabled = true; btn.textContent = '转写中…';
    try {
      const r = await api('/api/asr/run?limit=1&scope=all', {method: 'POST'});
      btn.textContent = r.ok ? '转写完成,刷新看' : '这条没转成';
      if (r.ok) setTimeout(load, 600);
    } catch (e) { btn.textContent = '失败:' + e.message.slice(0, 20); btn.disabled = false; }
  });
}

/* 选定窗口里没内容时,回头看更大的窗口:最近一条到底多久前。
   与其让人对着「没有」发呆,不如告诉他真相 —— 是博主没发,还是我没抓。 */
async function probeLatest() {
  try {
    const wide = await api('/api/digest?days=90');
    const items = (wide.info.creators || []).flatMap(c =>
      c.items.map(i => ({...i, who: c.nickname})));
    const box = $('#nothing'), line = $('#why');
    if (!box || !line) return;
    if (!items.length) {
      line.textContent = '往前翻 90 天也没有 —— 这几位最近确实没更新,或者还没抓过他们的新作品。';
      return;
    }
    items.sort((a, b) => (b.create_time || '').localeCompare(a.create_time || ''));
    const top = items[0];
    const days = Math.round((Date.now() - new Date(top.create_time.replace(' ', 'T'))) / 864e5);
    line.textContent = `最近一条是 ${days} 天前:${top.who}《${
      (top.item_title || top.description || '').slice(0, 22)}》。`;
    box.insertAdjacentHTML('beforeend',
      `<br><button class="btn" data-days="90" style="margin-top:8px">看最近 90 天 →</button>`);
    wire();
  } catch (e) { /* 探测失败就维持原样,不影响主流程 */ }
}

async function load() {
  $('#body').innerHTML = '<div class="skel">读取中…</div>';
  try {
    DATA = await api('/api/digest?days=' + DAYS);
    render();
    mountFetchBar('#fetchbar', 'info', DAYS, load);
  } catch (e) {
    $('#body').innerHTML = `<div class="empty"><b>读取失败</b>${esc(e.message)}</div>`;
  }
}

api('/api/runs?limit=1').then(r => {
  const it = r.items && r.items[0];
  navSync(it && (it.finished_at || it.started_at));
}).catch(() => {});

load();
</script>
