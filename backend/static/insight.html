<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>认识自己 · Douyin-DB</title>
<link rel="stylesheet" href="/shell.css?v=1786272435">
<style>
.hero{margin:22px 0 6px;font-size:26px;line-height:1.4;font-weight:600;letter-spacing:-.4px}
.hero b{color:var(--accent-text);font-weight:600}
.hero .warm{color:var(--warn-text)}
.herosub{color:var(--dim);font-size:13.5px;margin-bottom:26px}

/* 每段:序号 + 标题 + 图/表 + 大结论 */
.seg{border-top:1px solid var(--line);padding:26px 0}
.seg:first-of-type{border-top:0}
.seghd{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.seghd .no{font:600 13px/1 var(--mono);color:var(--dim2);letter-spacing:1px}
.seghd h2{margin:0;font-size:17px;font-weight:600}
.seghd .cap{margin-left:auto;font-size:12px;color:var(--dim2)}
/* 「所以呢」结论块 —— 每段的灵魂,视觉要重 */
.soo{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:9px;padding:13px 16px;margin:14px 0 2px;font-size:14.5px;line-height:1.75}
.soo .lbl{color:var(--accent-text);font-weight:600;font-size:12px;margin-right:6px}

/* 标签球 */
.sphere{position:relative;height:340px;margin:6px 0}
.sphere canvas{width:100%;height:100%;display:block;cursor:grab}
.sphere .pause{position:absolute;right:0;bottom:0;font-size:12px;color:var(--dim)}

/* 构成条 */
.compo{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.compo .row{display:grid;grid-template-columns:96px 1fr 96px;gap:10px;align-items:center;font-size:13px}
.compo .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.compo .bar i{display:block;height:100%;background:var(--accent)}
.compo .row:nth-child(2) .bar i{background:var(--violet)}
.compo .row:nth-child(3) .bar i{background:var(--warn)}
.compo .n{text-align:right;color:var(--dim);font-family:var(--mono);font-size:12px}

/* 通用表 */
table.t{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
table.t th{text-align:left;color:var(--dim2);font-weight:500;font-size:11.5px;padding:6px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td.num{text-align:right;font-family:var(--mono);color:var(--dim)}
table.t tr:last-child td{border-bottom:0}
.pill{font-size:11px;padding:1px 7px;border-radius:4px}
.pill.gap{background:var(--warn-dim);color:var(--warn-text)}
.pill.ok{background:var(--ok-dim);color:var(--ok)}

/* 想学vs看:两条对比 */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.vs .col{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.vs .col h4{margin:0 0 8px;font-size:12.5px;color:var(--dim);font-weight:500}
.vs .seg2{display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:11px}
.vs .seg2 span{display:flex;align-items:center;justify-content:center;color:#0a0c0f;font-weight:600}

/* 干货率 */
.qual{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.qual .row{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.qual .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.qual .bar i{display:block;height:100%}
.qual .pct{text-align:right;font-family:var(--mono);font-size:12px;color:var(--dim)}
.qual .tag{color:var(--fg)}

/* 时长直方 */
.hist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hist .row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.hist .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.hist .bar i{display:block;height:100%;background:var(--accent)}

.ev{margin:8px 0 0;padding:0;list-style:none;color:var(--dim);font-size:13px;line-height:1.9}
.ev li::before{content:"·";color:var(--dim2);margin-right:8px}
.why{color:var(--dim2);font-size:12px;margin-top:8px;line-height:1.6}
.link{display:inline-block;margin-top:10px;font-size:13px}

/* 问答 */
.ask{margin-top:30px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px}
.ask h3{margin:0 0 4px;font-size:15px}
.ask p{margin:0 0 12px;color:var(--dim2);font-size:12px}
.ask .box{display:flex;gap:8px}
.ask input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;color:var(--fg);font-size:14px}
.ask input:focus{outline:none;border-color:var(--accent-line)}
.ask .sugs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.ask .sug{font-size:12px;color:var(--dim);background:var(--surface2);border:1px solid var(--line);
  border-radius:20px;padding:5px 11px;cursor:pointer}
.ask .sug:hover{color:var(--fg);border-color:var(--accent-line)}
.ans{margin-top:14px;font-size:14px;line-height:1.75;white-space:pre-wrap}
.ans .cite{display:block;margin-top:8px;font-size:12px;color:var(--dim)}
.skel{color:var(--dim2);font-size:13px;padding:40px 0;text-align:center}
</style>

<div class="wrap narrow">
  <div class="phead">
    <h1>认识自己</h1>
    <p id="scope">从我做过的收藏和点赞里看我自己</p>
  </div>

  <div id="body"><div class="skel">正在分析…</div></div>
</div>

<script src="/shell.js?v=1786272435"></script>
<script>
'use strict';
mountNav('insight');

const PALETTE = ['#4c8dff', '#a78bfa', '#ff7a45', '#5cb87a', '#e8b04b', '#5b6675'];

async function load() {
  try {
    const [ins, asp, qual, graph] = await Promise.all([
      api('/api/insight'),
      api('/api/insight/aspects'),
      api('/api/insight/quality?min_n=15&limit=6'),
      api('/api/insight/graph?min_count=5&max_nodes=80'),
    ]);
    render(ins.stats || ins, asp, qual, graph);
  } catch (e) {
    $('#body').innerHTML = `<div class="empty"><b>分析失败</b>${esc(e.message)}</div>`;
  }
}

function part(stats, id) { return (stats.parts || []).find(p => p.id === id) || {}; }

function render(stats, asp, qual, graph) {
  const contrast = part(stats, 'contrast');
  const shape = part(stats, 'shape');
  const drift = part(stats, 'drift');
  const tension = part(stats, 'tension');

  $('#scope').textContent =
    `只统计我主动选的 ${fmt(stats.n_videos)} 条 · 收藏 / 点赞 / 我发的 · 博主发的不算`;

  // 顶部一句话画像:优先 AI 画像,没有就用「核心张力」
  const heroText = (stats.narrative && stats.narrative.split('\n')[0])
    || (tension.headline) || '看看你都存了些什么。';

  // 01 构成:contrast.table 里 fav+lik 求和 = 我的收藏点赞总构成
  const comp = (contrast.table || []).map(r => ({cat: r.cat, n: r.fav + r.lik}))
    .sort((a, b) => b.n - a.n);
  const compTotal = comp.reduce((s, r) => s + r.n, 0) || 1;
  const top3 = comp.slice(0, 3), rest = comp.slice(3);
  const top3pct = Math.round(top3.reduce((s, r) => s + r.n, 0) * 100 / compTotal);

  // 02 关注的人:真实故事 = 97 位里多少从没看过
  const seen = asp.categorizable, unknown = asp.unknown;

  let html = `
    <div class="hero">${heroConclusion(heroText)}</div>
    <div class="herosub">下面几段是拆解 —— 每段都写清「所以呢」,基于真实数据,不够的地方会直说。</div>

    <!-- 01 兴趣构成 -->
    <section class="seg">
      <div class="seghd"><span class="no">01</span><h2>我的兴趣构成</h2>
        <span class="cap">拖动球体可以转 · 每个点是一个话题,越大存得越多</span></div>
      <div class="sphere"><canvas id="sph"></canvas><button class="pause" id="sphpause">暂停旋转</button></div>
      <div class="compo">${comp.slice(0, 5).map(r => {
        const pct = Math.round(r.n * 100 / compTotal);
        return `<div class="row"><span>${esc(r.cat)}</span>
          <span class="bar"><i style="width:${pct}%"></i></span>
          <span class="n">${pct}% · ${r.n} 条</span></div>`;
      }).join('')}</div>
      <div class="soo"><span class="lbl">所以呢</span>前三个话题占了 ${top3pct}%,
        剩下的加起来才 ${100 - top3pct}%。你不是什么都存 —— 兴趣其实很窄,
        窄到可以直接把这几条当知识库主线来经营。</div>
    </section>

    <!-- 02 关注的人分方面 -->
    <section class="seg">
      <div class="seghd"><span class="no">02</span><h2>我关注的人,都在做什么</h2></div>
      <table class="t"><thead><tr><th>方面</th><th class="num">关注了几位</th>
        <th class="num">我收藏过</th><th></th></tr></thead><tbody>
        ${asp.items.map(x => `<tr><td>${esc(x.aspect)}</td>
          <td class="num">${x.follow}</td><td class="num">${x.saved}</td>
          <td><span class="pill ${x.gap > 0 ? 'gap' : 'ok'}">${esc(x.verdict)}</span></td></tr>`).join('')}
      </tbody></table>
      <div class="soo"><span class="lbl">所以呢</span>你关注的 ${asp.total_following} 人里,
        <b>只有 ${seen} 人</b>你真正收藏过他们的内容 —— 另外 <span class="warm">${unknown} 人从没看过</span>。
        关注不等于在看。那 ${unknown} 人要么取关,要么正是「想跟却刷不到」、最该做成每日简报的。
        <a class="link" href="/creators.html">按这个去挑博主 →</a></div>
      <div class="why">${esc(asp.note)}</div>
    </section>

    <!-- 03 想学 vs 真正在看 -->
    ${contrast.headline ? `<section class="seg">
      <div class="seghd"><span class="no">03</span><h2>想学的 vs 真正在看的</h2></div>
      ${vsBlock(contrast)}
      <div class="soo"><span class="lbl">所以呢</span>${esc(contrast.headline)}
        —— 收藏夹是你对自己的期望,点赞才是真实注意力。想改变什么,盯点赞,别盯收藏夹。</div>
    </section>` : ''}

    <!-- 04 干货率 -->
    <section class="seg">
      <div class="seghd"><span class="no">04</span><h2>哪些话题是干货,哪些只是刷</h2></div>
      <div class="qual">${qual.items.map(x => `<div class="row">
        <span class="tag">#${esc(x.tag)}</span>
        <span class="bar"><i style="width:${x.rate}%;background:${x.rate >= 45 ? 'var(--ok)' : x.rate >= 30 ? 'var(--accent)' : 'var(--warn)'}"></i></span>
        <span class="pct">${x.rate}%</span></div>`).join('')}</div>
      <div class="soo"><span class="lbl">所以呢</span>标签数量骗人。
        同样攒了几十条,${topQual(qual)} —— 你以为攒了一堆,其实攒的可能是一堆空壳。</div>
      <div class="why">${esc(qual.note)}</div>
    </section>

    <!-- 05 兴趣漂移 -->
    <section class="seg">
      <div class="seghd"><span class="no">05</span><h2>兴趣是怎么变的</h2>
        <span class="cap">月级精度 —— 做不了「我几点刷抖音」</span></div>
      <ul class="ev">${(drift.evidence || ['还需要更多快照才能看出变化']).map(e => `<li>${esc(e)}</li>`).join('')}</ul>
      <div class="soo"><span class="lbl">所以呢</span>${esc(drift.headline || '目前只有少量历史快照,趋势还看不出来 —— 多分析几次就有了。')}</div>
    </section>

    <!-- 06 时长形态 -->
    <section class="seg">
      <div class="seghd"><span class="no">06</span><h2>我能看完多长的东西</h2></div>
      <ul class="ev">${(shape.evidence || []).map(e => `<li>${esc(e)}</li>`).join('')}</ul>
      <div class="soo"><span class="lbl">所以呢</span>${esc(shape.headline || '')}</div>
    </section>

    <!-- 问答 -->
    <div class="ask">
      <h3>还想问点别的?</h3>
      <p>只翻我主动存的内容 · 答案带出处 · 没依据就说没有</p>
      <div class="box">
        <input id="q" placeholder="问点关于我自己的…" autocomplete="off">
        <button class="btn go" id="qgo">问</button>
      </div>
      <div class="sugs">
        <span class="sug">我为什么老收藏不看?</span>
        <span class="sug">我到底在看什么内容?</span>
        <span class="sug">我收藏里最有干货的是哪些?</span>
      </div>
      <div class="ans" id="ans" hidden></div>
    </div>`;

  $('#body').innerHTML = html;
  drawSphere(graph);
  wireAsk();
}

function heroConclusion(text) {
  // 把画像里第一句加重:如果含「但」,「但」后半句用暖色(理想 vs 实际的反差)
  const i = text.indexOf('但');
  if (i > 0) return `${esc(text.slice(0, i))}<br><span class="warm">${esc(text.slice(i))}</span>`;
  return esc(text);
}

function vsBlock(c) {
  // 用 table 的前两类拼「学习 vs 娱乐」对比不总成立,直接用 evidence + table 展示落差
  const rows = (c.table || []).slice(0, 5);
  return `<table class="t"><thead><tr><th>分类</th><th class="num">收藏</th>
    <th class="num">点赞</th><th class="num">差</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.cat)}</td>
      <td class="num">${r.fav_pct}%</td><td class="num">${r.lik_pct}%</td>
      <td class="num" style="color:${r.gap > 0 ? 'var(--accent-text)' : 'var(--warn-text)'}">${r.gap > 0 ? '+' : ''}${r.gap}</td></tr>`).join('')}
  </tbody></table>`;
}

function topQual(q) {
  const items = q.items.filter(x => x.n >= 15);
  if (items.length < 2) return '有的话题几乎全是干货,有的几乎全是空壳';
  const hi = items.reduce((a, b) => a.rate > b.rate ? a : b);
  const lo = items.reduce((a, b) => a.rate < b.rate ? a : b);
  return `#${hi.tag} 里 ${hi.rate}% 真有内容,#${lo.tag} 只有 ${lo.rate}%`;
}

/* ── 标签球:Fibonacci 球面分布 + 自转。用 graph 的节点。 ── */
function drawSphere(graph) {
  const cv = $('#sph'); if (!cv) return;
  const nodes = (graph.nodes || []).slice(0, 60);
  if (!nodes.length) { cv.parentElement.style.display = 'none'; return; }
  const dpr = Math.min(devicePixelRatio || 1, 2);
  function size() { cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; }
  size(); addEventListener('resize', size);
  const maxc = Math.max(...nodes.map(n => n.count || n.n || 1));
  // Fibonacci 球面
  const pts = nodes.map((n, i) => {
    const y = 1 - (i / (nodes.length - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const th = Math.PI * (3 - Math.sqrt(5)) * i;
    return {x: Math.cos(th) * r, y, z: Math.sin(th) * r,
      label: n.tag || n.id || n.label, w: (n.count || n.n || 1) / maxc,
      color: PALETTE[i % PALETTE.length]};
  });
  let ax = 0, ay = 0, paused = false, drag = null;
  cv.onpointerdown = e => { drag = {x: e.clientX, y: e.clientY, ax, ay}; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!drag) return; ay = drag.ay + (e.clientX - drag.x) * .01; ax = drag.ax + (e.clientY - drag.y) * .01; };
  cv.onpointerup = () => drag = null;
  $('#sphpause').onclick = function () { paused = !paused; this.textContent = paused ? '继续旋转' : '暂停旋转'; };

  function frame() {
    if (!paused && !drag) ay += 0.0032;
    const w = cv.width, h = cv.height, cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.38;
    const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, w, h);
    const cosX = Math.cos(ax), sinX = Math.sin(ax), cosY = Math.cos(ay), sinY = Math.sin(ay);
    const proj = pts.map(p => {
      let x = p.x * cosY - p.z * sinY, z = p.x * sinY + p.z * cosY, y = p.y;
      const y2 = y * cosX - z * sinX; z = y * sinX + z * cosX; y = y2;
      const scale = (z + 1.8) / 2.8;
      return {sx: cx + x * R, sy: cy + y * R, z, scale, p};
    }).sort((a, b) => a.z - b.z);
    for (const q of proj) {
      const alpha = 0.35 + q.scale * 0.65;
      const fs = (11 + q.p.w * 12) * q.scale * dpr;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = q.p.color;
      ctx.beginPath(); ctx.arc(q.sx, q.sy, (2 + q.p.w * 4) * q.scale * dpr, 0, 7); ctx.fill();
      if (q.p.w > 0.28 || q.scale > 0.7) {
        ctx.font = `${fs}px -apple-system,"PingFang SC",sans-serif`;
        ctx.fillStyle = `rgba(233,236,241,${alpha})`;
        ctx.fillText(q.p.label, q.sx + 5 * dpr, q.sy + 4 * dpr);
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();
}

/* ── 问答 ── */
function wireAsk() {
  const go = async () => {
    const q = $('#q').value.trim(); if (!q) return;
    const ans = $('#ans'); ans.hidden = false; ans.textContent = '想…';
    try {
      const r = await api('/api/ask?q=' + encodeURIComponent(q));
      if (!r.answered) { ans.textContent = r.answer || '库里没有相关内容。'; return; }
      ans.innerHTML = esc(r.answer) + (r.citations || []).map(c =>
        `<span class="cite">[${c.n}] ${esc(c.author || '')}《${esc((c.title || '').slice(0, 30))}》 · 相关度 ${c.score}</span>`).join('');
    } catch (e) { ans.textContent = '出错:' + e.message; }
  };
  $('#qgo').onclick = go;
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $$('.ask .sug').forEach(s => s.onclick = () => { $('#q').value = s.textContent; go(); });
}

load();
</script>
