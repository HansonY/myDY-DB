<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我关注的人 · Douyin-DB</title>
<link rel="stylesheet" href="/shell.css?v=1786286777">
<style>
/* 只放这页独有的:名单表格 + 角色按钮。其余在 shell.css */

.grp2{margin:26px 0 10px;display:flex;align-items:baseline;gap:9px}
.grp2 h2{margin:0;font-size:13.5px;font-weight:600}
.grp2 em{font-style:normal;color:var(--dim);font-size:12px}

.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 58px 70px 132px 92px;
  gap:12px;align-items:center;padding:11px 14px;
  border-top:1px solid var(--line);background:var(--surface);transition:background .12s}
.list .row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row.picked{background:rgba(91,157,217,.06)}
.row.picked:hover{background:rgba(91,157,217,.1)}
.who{min-width:0}
.who b{display:block;font-weight:500;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;color:var(--dim2);font-size:11.5px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font:500 14px/1 var(--mono);text-align:right}
.num i{font-style:normal;color:var(--dim2);font-size:11px;display:block;margin-top:3px}
.num.zero{color:var(--dim2)}
.num.good{color:var(--accent)}
.st{font-size:11.5px;text-align:right;color:var(--dim2)}
.st.done{color:var(--ok)}
.head{display:grid;grid-template-columns:1fr 58px 70px 132px 92px;gap:12px;
  padding:0 14px 7px;font-size:11px;color:var(--dim2)}
.head span:nth-child(n+2){text-align:right}

/* 角色:这个人对我意味着什么。两类的用途完全不同 ——
   信息价值要的是他讲的内容,竞品要的是他的打法。 */
.roles{display:flex;gap:5px;justify-content:flex-end}
.rb{border:1px solid var(--line);background:var(--surface2);color:var(--dim);
  border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer;
  transition:.14s var(--ease);white-space:nowrap}
.rb:hover{color:var(--fg);border-color:var(--accent-line)}
.rb.on-info{background:var(--accent-dim);border-color:var(--accent-line);color:#a9cdf0}
.rb.on-rival{background:var(--warn-dim);border-color:var(--warn-line);color:var(--warn)}

@media(max-width:720px){
  .row,.head{grid-template-columns:1fr 52px 60px}
  .roles,.head span:nth-child(4),.head span:nth-child(5){display:none}
  .row .roles{display:flex;grid-column:1/-1;padding-top:8px}
  .st{grid-column:1/-1;text-align:left;padding-top:2px}
}
</style>

<div class="wrap">
  <div class="phead">
    <h1>我关注的人</h1>
    <p>选出要跟的人并分类 —— 只有打了标的人会被采集、会进「今天」</p>
  </div>

  <div class="facts" id="facts"></div>
  <p class="notice info" id="note" style="margin-top:12px"></p>

  <div class="bar">
    <button class="btn net" id="sync" title="会向抖音发请求(约 5 页)">刷新关注列表</button>
    <button class="btn go" id="crawl" disabled>先给人打标签</button>
    <span class="gap"></span>
    <span class="hint" id="msg"></span>
  </div>

  <div id="body"><div class="empty">读取中…</div></div>
</div>

<script src="/shell.js?v=1786286777"></script>
<script>
'use strict';
mountNav('creators');

/* 采集节奏:f2 实测每页间隔 8 秒,一页 20 条 */
const PER_PAGE = 20, SEC_PER_PAGE = 8;
const costOf = n => {
  const pages = Math.ceil((n || 0) / PER_PAGE);
  const mins = pages * SEC_PER_PAGE / 60;
  return {pages, mins,
    text: !n ? '—' : mins >= 60 ? (mins / 60).toFixed(1) + ' 小时'
        : mins >= 1 ? Math.round(mins) + ' 分钟' : '<1 分钟'};
};

let ALL = [];

function statusOf(u) {
  if (!u.role) return {cls: '', text: ''};
  if (u.crawled_n) return {cls: 'done', text: '每天跟'};
  return {cls: '', text: '待抓'};
}

function rowHtml(u) {
  const c = costOf(u.aweme_count);
  const st = statusOf(u);
  const savedCls = u.saved_n >= 3 ? 'good' : u.saved_n ? '' : 'zero';
  return `<div class="row${u.role ? ' picked' : ''}" data-id="${u.sec_user_id}">
    <div class="who">
      <b>${esc(u.nickname || '(无名)')}</b>
      <span>${esc(u.signature || '')}</span>
    </div>
    <div class="num ${savedCls}">${u.saved_n}<i>我存过</i></div>
    <div class="num">${fmt(u.aweme_count)}<i>他共发</i></div>
    <div class="roles">
      <button class="rb ${u.role === 'info' ? 'on-info' : ''}" data-role="info"
        title="我要的是他讲的内容 —— 进知识库,能被检索问答">信息价值</button>
      <button class="rb ${u.role === 'rival' ? 'on-rival' : ''}" data-role="rival"
        title="我要的是他的打法 —— 选题/时长/节奏/互动,和上期对比">竞品</button>
    </div>
    <div class="st ${st.cls}">${st.text}${
      u.crawled_n ? `<br><span style="color:var(--dim2)">已入库 ${u.crawled_n}</span>` : ''}</div>
  </div>`;
}

function render() {
  const saved = ALL.filter(u => u.saved_n > 0);
  const never = ALL.filter(u => !u.saved_n);
  const picked = ALL.filter(u => u.role);
  const nInfo = ALL.filter(u => u.role === 'info').length;
  const nRival = ALL.filter(u => u.role === 'rival').length;
  const allItems = ALL.reduce((s, u) => s + (u.aweme_count || 0), 0);

  $('#facts').innerHTML = `
    <div class="fact"><b>${ALL.length}</b><span>我关注的人</span></div>
    <div class="fact hot"><b>${fmt(allItems)}</b><span>他们一共发过</span></div>
    <div class="fact hot"><b>${costOf(allItems).text}</b><span>全爬要这么久(所以不全爬)</span></div>
    <div class="fact"><b>${never.length}</b><span>一条都没存过</span></div>
    <div class="fact on"><b>${nInfo}</b><span>信息价值主播</span></div>
    <div class="fact on"><b>${nRival}</b><span>竞品主播</span></div>`;

  $('#note').innerHTML =
    `<b>只跟你选的人。</b>没打标的人一次请求都不会发 —— 关注列表有 ${ALL.length} 位,` +
    `但只采你标了的那几位,简报里也只有他们。<br>` +
    `<b>不爬历史,只跟最新。</b>标了的人每天只抓最近三天的新作品 —— 每人翻一页左右,` +
    `一分多钟跑完。全量爬他们的历史要 ${costOf(allItems).text},而且第 20 页就会被拒,所以不做。<br>` +
    `<b>两类的用途完全不同:</b>「信息价值」要的是他<b>讲了什么</b>(进知识库,能检索能问答);` +
    `「竞品」要的是他的<b>打法</b>(选题/时长/发布节奏/互动效果,每期和上期对比)。<br>` +
    `挑人看「我存过他几条」—— 这 ${ALL.length} 位里 ${never.length} 位我一条都没存过,那是最实的价值信号。` +
    `抓来的作品单独归类,<b>不会混进「认识自己」的分析,也不会淹掉你自己收藏的检索结果</b>。`;

  const head = `<div class="head"><span>作者</span>
    <span>我存过</span><span>他共发</span><span>跟不跟 · 跟哪种</span><span>状态</span></div>`;
  $('#body').innerHTML =
    `<div class="grp2"><h2>我存过他作品的</h2><em>${saved.length} 位 · 值得考虑</em></div>
     ${head}<div class="list">${saved.map(rowHtml).join('') || '<div class="empty">还没有</div>'}</div>
     <div class="grp2"><h2>关注了但一条没存</h2><em>${never.length} 位 · 一般不必采</em></div>
     ${head}<div class="list">${never.map(rowHtml).join('') || '<div class="empty">没有</div>'}</div>`;

  $('#crawl').disabled = !picked.length;
  $('#crawl').textContent = picked.length
    ? `抓这 ${picked.length} 位最近三天的` : '先给人打标签';
}

async function load() {
  try {
    ALL = (await api('/api/following')).items;
    if (!ALL.length) {
      $('#body').innerHTML =
        '<div class="empty">还没有关注列表 —— 点上面「刷新关注列表」<br>' +
        '<span style="font-size:12.5px">只读 5 页左右,很轻</span></div>';
      $('#facts').innerHTML = '';
      $('#note').textContent = '';
      return;
    }
    render();
  } catch (e) {
    $('#body').innerHTML = `<div class="empty">读取失败:${esc(e.message)}</div>`;
  }
}

$('#body').addEventListener('click', async ev => {
  const btn = ev.target.closest('.rb');
  if (!btn) return;
  const row = btn.closest('.row');
  const id = row.dataset.id;
  const u = ALL.find(x => x.sec_user_id === id);
  const want = btn.dataset.role;
  // 再点一次同一个 = 取消跟这个人
  const next = (u && u.role === want) ? null : want;
  const prev = u ? u.role : null;
  if (u) u.role = next;              // 先本地生效,界面不卡
  render();
  try {
    await api('/api/following/role', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sec_user_ids: [id], role: next}),
    });
    const name = u ? u.nickname : '';
    say('#msg', next === 'info' ? `${name} → 信息价值(每天抓他的新内容)`
      : next === 'rival' ? `${name} → 竞品(每天算他的打法)`
      : `不跟 ${name} 了`);
  } catch (e) {
    if (u) u.role = prev;            // 存不进去就回滚,别让界面骗人
    render();
    say('#msg', '保存失败:' + e.message, true);
  }
});

$('#sync').addEventListener('click', async () => {
  const b = $('#sync');
  b.disabled = true; b.textContent = '刷新中…'; say('#msg', '正在读关注列表(约 5 页)');
  try {
    const r = await api('/api/following/sync', {method: 'POST'});
    say('#msg', `拿到 ${r.fetched} 位,其中新增 ${r.new} 位`);
    await load();
  } catch (e) { say('#msg', e.message, true); }
  b.disabled = false; b.textContent = '刷新关注列表';
});

$('#crawl').addEventListener('click', async () => {
  const picked = ALL.filter(u => u.role);
  if (!confirm(`抓这 ${picked.length} 位最近三天的新作品。\n\n`
    + '每人翻一页左右,一分多钟。抓完去「看简报」。\n\n继续?')) return;
  const b = $('#crawl');
  b.disabled = true; b.textContent = '抓取中…';
  say('#msg', '在抓。可以关掉这页,进度不丢。');
  try {
    const r = await api('/api/digest/refresh?days=3', {method: 'POST'});
    say('#msg', r.note ? r.note
      : r.stopped_on_403 ? `被限流打断,已入库 ${r.new} 条。过一阵再点。`
      : `抓完了:发现 ${r.found} 条 · 新增 ${r.new} 条 —— 去「看简报」`,
      !!r.stopped_on_403);
    await load();
  } catch (e) { say('#msg', e.message, true); }
  b.disabled = false; render();
});

load();
</script>
