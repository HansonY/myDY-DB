<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我关注的人 · Douyin-DB</title>
<style>
/* 沿用 index.html 的视觉语言:近黑底、单强调色、数字等宽 */
:root{
  --bg:#0b0d11; --surface:#11141a; --surface2:#161a21; --line:#20252e;
  --fg:#e7ebf0; --dim:#78808c; --dim2:#565e69;
  --accent:#5b9dd9; --accent-dim:rgba(91,157,217,.13); --accent-line:rgba(91,157,217,.3);
  --warn:#c9a153; --warn-dim:rgba(201,161,83,.1);
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 80px}
a{color:var(--accent);text-decoration:none}

/* ── 页头 ── */
.top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.2px}
.sub{color:var(--dim);font-size:13px;display:block;margin-top:3px}
.back{margin-left:auto;font-size:13px;color:var(--dim);
  border:1px solid var(--line);border-radius:7px;padding:6px 12px;transition:.15s var(--ease)}
.back:hover{color:var(--fg);border-color:var(--accent-line)}

/* ── 事实条:把「为什么不全爬」摆在脸上 ── */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:9px;overflow:hidden;margin-bottom:8px}
.fact{background:var(--surface);padding:12px 14px}
.fact b{display:block;font:600 19px/1.25 var(--mono);letter-spacing:-.4px}
.fact span{color:var(--dim);font-size:11.5px;display:block;margin-top:2px}
.fact.hot b{color:var(--warn)}
.fact.on b{color:var(--accent)}
.note{color:var(--dim);font-size:12.5px;margin:0 0 20px;line-height:1.65}
.note b{color:var(--warn);font-weight:600}

/* ── 操作条 ── */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.btn{background:var(--surface2);color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:7px 13px;font-size:13px;cursor:pointer;
  transition:.15s var(--ease);font-family:inherit}
.btn:hover:not(:disabled){border-color:var(--accent-line);background:#1b2029}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--accent-dim);border-color:var(--accent-line);color:#a9cdf0}
.spacer{flex:1}
.hint{color:var(--dim2);font-size:12px}

/* ── 名单 ── */
.grp{margin:26px 0 10px;display:flex;align-items:baseline;gap:9px}
.grp h2{margin:0;font-size:13.5px;font-weight:600;color:var(--fg)}
.grp em{font-style:normal;color:var(--dim);font-size:12px}
.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.row{display:grid;grid-template-columns:26px 1fr 62px 74px 92px 96px;
  gap:12px;align-items:center;padding:11px 14px;
  border-top:1px solid var(--line);background:var(--surface);transition:background .12s}
.list .row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row.picked{background:rgba(91,157,217,.06)}
.row.picked:hover{background:rgba(91,157,217,.1)}
.ck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.who{min-width:0}
.who b{display:block;font-weight:500;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;color:var(--dim2);font-size:11.5px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font:500 14px/1 var(--mono);text-align:right}
.num i{font-style:normal;color:var(--dim2);font-size:11px;display:block;margin-top:3px}
.num.zero{color:var(--dim2)}
.num.good{color:var(--accent)}
.cost{font:12px/1.35 var(--mono);color:var(--dim);text-align:right}
.cost.heavy{color:var(--warn)}
.st{font-size:11.5px;text-align:right;color:var(--dim2)}
.st.done{color:#6b9e73}
.st.part{color:var(--warn)}
.head{display:grid;grid-template-columns:26px 1fr 62px 74px 92px 96px;gap:12px;
  padding:0 14px 7px;font-size:11px;color:var(--dim2)}
.head span:nth-child(n+3){text-align:right}
.empty{padding:34px;text-align:center;color:var(--dim)}
@media(max-width:720px){
  .row,.head{grid-template-columns:24px 1fr 56px 64px;}
  .cost,.head span:nth-child(5){display:none}
  .st{grid-column:2/-1;text-align:left;padding-top:2px}
  .head span:nth-child(6){display:none}
}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>我关注的人</h1>
      <span class="sub">挑出真正的知识源,只深挖他们 —— 而不是全爬</span>
    </div>
    <a class="back" href="/">← 回浏览</a>
  </div>

  <div class="facts" id="facts"></div>
  <p class="note" id="note"></p>

  <div class="bar">
    <button class="btn" id="sync">刷新关注列表</button>
    <button class="btn go" id="crawl" disabled>采勾选的人</button>
    <span class="spacer"></span>
    <span class="hint" id="msg"></span>
  </div>

  <div id="body"><div class="empty">读取中…</div></div>
</div>

<script>
'use strict';
/* ── 常量必须在使用前声明。之前踩过:const 不会提升,
   在声明之前引用会抛 ReferenceError,整页白屏且 node --check 查不出来。 ── */
const $ = s => document.querySelector(s);
const fmt = n => (n == null ? '—' : Number(n).toLocaleString('en-US'));

/* 采集节奏:f2 实测每页间隔 8 秒,一页 20 条 */
const PER_PAGE = 20, SEC_PER_PAGE = 8;
const costOf = n => {
  const pages = Math.ceil((n || 0) / PER_PAGE);
  const mins = pages * SEC_PER_PAGE / 60;
  return {pages, mins,
    text: !n ? '—' : mins >= 60 ? (mins / 60).toFixed(1) + ' 小时'
        : mins >= 1 ? Math.round(mins) + ' 分钟' : '<1 分钟'};
};

let ALL = [];

function statusOf(u) {
  if (u.crawl_done_at && !u.crawl_cursor) return {cls: 'done', text: '已采全'};
  if (u.crawl_cursor) return {cls: 'part', text: '采了一半'};
  if (u.crawl) return {cls: '', text: '待采'};
  return {cls: '', text: ''};
}

function rowHtml(u) {
  const c = costOf(u.aweme_count);
  const st = statusOf(u);
  const savedCls = u.saved_n >= 3 ? 'good' : u.saved_n ? '' : 'zero';
  return `<div class="row${u.crawl ? ' picked' : ''}" data-id="${u.sec_user_id}">
    <input class="ck" type="checkbox" ${u.crawl ? 'checked' : ''}
           aria-label="深挖 ${(u.nickname || '').replace(/"/g, '')}">
    <div class="who">
      <b>${esc(u.nickname || '(无名)')}</b>
      <span>${esc(u.signature || '')}</span>
    </div>
    <div class="num ${savedCls}">${u.saved_n}<i>我存过</i></div>
    <div class="num">${fmt(u.aweme_count)}<i>他共发</i></div>
    <div class="cost ${c.mins >= 30 ? 'heavy' : ''}">${c.text}<br>
      <span style="color:var(--dim2)">${c.pages} 页</span></div>
    <div class="st ${st.cls}">${st.text}${
      u.crawled_n ? `<br><span style="color:var(--dim2)">已入库 ${u.crawled_n}</span>` : ''}</div>
  </div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
}

function render() {
  const saved = ALL.filter(u => u.saved_n > 0);
  const never = ALL.filter(u => !u.saved_n);
  const picked = ALL.filter(u => u.crawl);
  const pickedItems = picked.reduce((s, u) => s + (u.aweme_count || 0), 0);
  const allItems = ALL.reduce((s, u) => s + (u.aweme_count || 0), 0);

  $('#facts').innerHTML = `
    <div class="fact"><b>${ALL.length}</b><span>我关注的人</span></div>
    <div class="fact hot"><b>${fmt(allItems)}</b><span>他们一共发过</span></div>
    <div class="fact hot"><b>${costOf(allItems).text}</b><span>全爬要这么久</span></div>
    <div class="fact"><b>${never.length}</b><span>一条都没存过</span></div>
    <div class="fact on"><b>${picked.length}</b><span>已勾选深挖</span></div>
    <div class="fact on"><b>${costOf(pickedItems).text}</b><span>勾选的要这么久</span></div>`;

  $('#note').innerHTML =
    `<b>关注 ≠ 有价值。</b>这 ${ALL.length} 位里有 ${never.length} 位我一条作品都没存过,` +
    `而他们的产出占了总量的 ${allItems ? Math.round(
      never.reduce((s, u) => s + (u.aweme_count || 0), 0) * 100 / allItems) : 0}%。` +
    `所以按「我存过他几条」挑人 —— 那是唯一有实证的价值信号。` +
    `采来的作品单独归类,<b>不会混进「认识自己」的分析,也不会淹掉你自己收藏的检索结果</b>。`;

  const head = `<div class="head"><span></span><span>作者</span>
    <span>我存过</span><span>他共发</span><span>采他要多久</span><span>状态</span></div>`;
  $('#body').innerHTML =
    `<div class="grp"><h2>我存过他作品的</h2><em>${saved.length} 位 · 值得考虑</em></div>
     ${head}<div class="list">${saved.map(rowHtml).join('') || '<div class="empty">还没有</div>'}</div>
     <div class="grp"><h2>关注了但一条没存</h2><em>${never.length} 位 · 一般不必采</em></div>
     ${head}<div class="list">${never.map(rowHtml).join('') || '<div class="empty">没有</div>'}</div>`;

  $('#crawl').disabled = !picked.length;
  $('#crawl').textContent = picked.length
    ? `采勾选的 ${picked.length} 位(${costOf(pickedItems).text})` : '采勾选的人';
}

async function api(url, opt) {
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    // FastAPI 的 422 detail 是数组,直接模板化会变成 [object Object]
    const d = j.detail;
    throw new Error(Array.isArray(d) ? d.map(x => x.msg || JSON.stringify(x)).join('; ')
      : typeof d === 'string' ? d : JSON.stringify(j));
  }
  return j;
}

function say(t, warn) {
  $('#msg').textContent = t || '';
  $('#msg').style.color = warn ? 'var(--warn)' : 'var(--dim2)';
}

async function load() {
  try {
    ALL = (await api('/api/following')).items;
    if (!ALL.length) {
      $('#body').innerHTML =
        '<div class="empty">还没有关注列表 —— 点上面「刷新关注列表」<br>' +
        '<span style="font-size:12.5px">只读 5 页左右,很轻</span></div>';
      $('#facts').innerHTML = '';
      $('#note').textContent = '';
      return;
    }
    render();
  } catch (e) {
    $('#body').innerHTML = `<div class="empty">读取失败:${esc(e.message)}</div>`;
  }
}

$('#body').addEventListener('change', async ev => {
  const ck = ev.target.closest('.ck');
  if (!ck) return;
  const id = ck.closest('.row').dataset.id;
  const on = ck.checked;
  const u = ALL.find(x => x.sec_user_id === id);
  if (u) u.crawl = on ? 1 : 0;           // 先本地生效,界面不卡
  render();
  try {
    await api('/api/following/crawl-flag', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sec_user_ids: [id], crawl: on}),
    });
    say(`${on ? '已勾选' : '已取消'} ${u ? u.nickname : ''}`);
  } catch (e) {
    if (u) u.crawl = on ? 0 : 1;         // 存不进去就回滚,别让界面骗人
    render();
    say('保存失败:' + e.message, true);
  }
});

$('#sync').addEventListener('click', async () => {
  const b = $('#sync');
  b.disabled = true; b.textContent = '刷新中…'; say('正在读关注列表(约 5 页)');
  try {
    const r = await api('/api/following/sync', {method: 'POST'});
    say(`拿到 ${r.fetched} 位,其中新增 ${r.new} 位`);
    await load();
  } catch (e) { say(e.message, true); }
  b.disabled = false; b.textContent = '刷新关注列表';
});

$('#crawl').addEventListener('click', async () => {
  const picked = ALL.filter(u => u.crawl);
  const c = costOf(picked.reduce((s, u) => s + (u.aweme_count || 0), 0));
  if (!confirm(`要采 ${picked.length} 位的全部作品,预计 ${c.text}(${c.pages} 页)。\n\n`
    + '会一直请求抖音,有触发限流的可能。被拒就整体停手,已采的都留着,下次接着走。\n\n继续?')) return;
  const b = $('#crawl');
  b.disabled = true; b.textContent = '采集中…';
  say('在采了。可以关掉这页,进度不丢 —— 回来刷新就能看到。');
  try {
    const r = await api('/api/following/crawl', {method: 'POST'});
    say(r.stopped_on_403
      ? `被限流打断,已新增 ${r.inserted} 条。断点存着,过一阵再点就接着走。`
      : `采完了,新增 ${r.inserted} 条。`, r.stopped_on_403);
    await load();
  } catch (e) { say(e.message, true); }
  b.disabled = false; render();
});

load();
</script>
