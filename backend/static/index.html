<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douyin-DB · 我的收藏知识库</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232c; --line:#242c37;
    --fg:#e6edf3; --dim:#8b959e; --accent:#2f81f7; --ok:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg)}
  a{color:var(--accent);text-decoration:none}
  header{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.92);
          backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{margin:0 0 10px;font-size:17px;font-weight:600;letter-spacing:.3px}
  h1 small{color:var(--dim);font-weight:400;margin-left:8px;font-size:13px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-bottom:12px}
  .stats b{color:var(--fg);font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
  .chip{padding:4px 11px;border-radius:20px;border:1px solid var(--line);
      background:var(--panel);color:var(--dim);cursor:pointer;font-size:12.5px}
  .chip:hover{border-color:#3a4552;color:var(--fg)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  select{padding:4px 9px;border-radius:8px;border:1px solid var(--line);
      background:var(--panel);color:var(--fg);font-size:12.5px;max-width:190px}
  .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .more{background:none;border:none;color:var(--accent);cursor:pointer;
      padding:2px 0;font-size:12.5px}
  input[type=search]{flex:1;min-width:200px;padding:9px 12px;border-radius:8px;
      border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:14px}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);
      background:var(--panel-2);color:var(--fg);cursor:pointer;font-size:13px}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  .notice{padding:12px 14px;border-radius:8px;margin-bottom:16px;font-size:13.5px;
      border:1px solid var(--line);background:var(--panel)}
  .notice.warn{border-color:#4a3a12;background:#241d0e;color:#e8c26a}
  .notice.run{border-color:#12304a;background:#0e1e2e;color:#84c5fb}
  .grid{display:grid;gap:10px}
  .card{display:flex;gap:12px;padding:12px;border:1px solid var(--line);
      border-radius:10px;background:var(--panel)}
  .card:hover{border-color:#313b47}
  .thumb{flex:0 0 88px;height:118px;border-radius:6px;background:var(--panel-2);
      object-fit:cover;display:block}
  .body{min-width:0;flex:1}
  .meta{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12.5px;margin-bottom:5px}
  .who{color:var(--fg);font-weight:500}
  .desc{white-space:pre-wrap;word-break:break-word;max-height:4.9em;overflow:hidden}
  .desc.open{max-height:none}
  .desc.empty{color:var(--dim);font-style:italic}
  .who{cursor:pointer}
  .who:hover{color:var(--accent)}
  .tagrow{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:20px;background:var(--panel-2);
      color:var(--dim);border:1px solid var(--line)}
  .tag.hash{cursor:pointer}
  .tag.hash:hover{color:var(--accent);border-color:var(--accent)}
  .empty-state{text-align:center;padding:64px 20px;color:var(--dim)}
  .empty-state code{background:var(--panel-2);padding:2px 7px;border-radius:5px;color:var(--fg)}
  footer{max-width:1100px;margin:0 auto;padding:0 20px 40px;display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Douyin-DB<small>抖音收藏 → 可搜索的知识库</small></h1>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="搜文案、作者、音乐名…">
    <button id="btn-fav" class="primary">采集收藏</button>
    <button id="btn-like">采集点赞</button>
    <button id="btn-posts">我的作品</button>
    <button id="btn-folders">同步收藏夹</button>
  </div>
  <div class="bar2">
    <span id="src-chips"></span>
    <span class="sep"></span>
    <select id="sort">
      <option value="collected">按存入时间</option>
      <option value="published">按发布时间</option>
      <option value="duration">按时长</option>
      <option value="author">按作者</option>
    </select>
    <select id="author"><option value="">全部作者</option></select>
    <button class="chip" id="btn-reset">重置</button>
  </div>
  <div class="bar2" id="tag-chips"></div>
</div></header>

<main>
  <div id="notices"></div>
  <div class="grid" id="list"></div>
</main>
<footer id="pager"></footer>

<script>
const $  = s => document.querySelector(s);
const api = (p, o) => fetch(p, o).then(async r => {
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
  return d;
});
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let offset = 0, limit = 50, total = 0, q = '', polling = null;
let source = '', sort = 'collected', author = '', tag = '', tagsOpen = false;

const SRC = {collection:'收藏', like:'点赞', post:'我的作品', collects:'收藏夹'};

// 毫秒 → 时长。收藏里既有 8 分钟的长视频,也有 24 小时的直播回放,
// 纯秒数和纯 m:ss 都读不出来。
function secs(ms){
  if (!ms) return '';
  const t = Math.round(ms/1000);
  if (t < 60)    return t + 's';
  if (t < 3600)  return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  const h = Math.floor(t/3600);
  return h < 24 ? `${h}h${String(Math.floor(t%3600/60)).padStart(2,'0')}m` : '直播/超长';
}

function params(){
  const p = new URLSearchParams({limit, offset, sort});
  if (q) p.set('q', q);
  if (source) p.set('source', source);
  if (author) p.set('nickname', author);
  if (tag) p.set('tag', tag);
  return p.toString();
}

async function loadStats(){
  const [s, h] = await Promise.all([api('/api/stats'), api('/api/health')]);
  $('#stats').innerHTML =
    `<span>作品 <b>${s.total}</b></span>` +
    `<span>有文案 <b>${s.with_description}</b></span>` +
    `<span>作者 <b>${s.authors}</b></span>`;

  // 来源筛选 chip：按库里实际有的来源渲染
  const entries = Object.entries(s.by_source || {});
  $('#src-chips').innerHTML =
    `<span class="chip${source ? '' : ' on'}" data-src="">全部 ${s.total}</span>` +
    entries.map(([k,v]) =>
      `<span class="chip${source === k ? ' on' : ''}" data-src="${k}">${SRC[k]||k} ${v}</span>`).join('');
  $('#src-chips').querySelectorAll('.chip').forEach(el => {
    el.onclick = () => { source = el.dataset.src; offset = 0; loadStats(); loadList(); };
  });

  // 用专属 class,避免把采集失败的 .warn 提示一起删掉
  const n = $('#notices');
  n.querySelector('.cookie-warn')?.remove();
  if (!h.cookie_configured){
    n.insertAdjacentHTML('afterbegin',
      `<div class="notice warn cookie-warn">还没登录。跑 <code>python backend/cli.py qrlogin</code> 扫码,或把 cookie 填进 <code>.env</code>。cookie 只存在你本机。</div>`);
  }
  return h;
}

async function loadList(){
  const d = await api('/api/videos?' + params());
  total = d.total;

  if (!d.items.length){
    $('#list').innerHTML = (q || source || author || tag)
      ? `<div class="empty-state">当前条件下没有结果。<button class="more" onclick="resetAll()">重置筛选</button></div>`
      : `<div class="empty-state">库还是空的。<br><br>点右上角 <code>采集收藏</code>,或命令行跑 <code>python backend/cli.py favorites</code></div>`;
    $('#pager').innerHTML = '';
    return;
  }

  $('#list').innerHTML = d.items.map(v => {
    const desc = (v.description || '').trim();
    const long = desc.length > 150 || desc.split('\n').length > 3;
    const srcs = (v.sources || v.source || '').split(',').filter(Boolean);
    const folders = (v.folders || '').split(',').filter(Boolean);
    return `<div class="card">
      ${v.cover
        ? `<img class="thumb" src="/api/cover/${encodeURIComponent(v.aweme_id)}" loading="lazy"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb'}))">`
        : `<div class="thumb"></div>`}
      <div class="body">
        <div class="meta">
          <span class="who" onclick="byAuthor('${esc(v.nickname).replace(/'/g,"\\'")}')"
                title="只看这个作者">${esc(v.nickname) || '未知作者'}</span>
          ${v.create_time ? `<span>${esc(String(v.create_time))}</span>` : ''}
          ${v.video_duration ? `<span>${secs(v.video_duration)}</span>` : ''}
          <a href="${esc(v.share_url)}" target="_blank" rel="noreferrer">打开 ↗</a>
        </div>
        <div class="desc${desc ? '' : ' empty'}">${desc ? esc(desc) : '（无文案）'}</div>
        ${long ? `<button class="more" onclick="toggleDesc(this)">展开全文</button>` : ''}
        <div class="tagrow">
          ${srcs.map(s => `<span class="tag">${SRC[s] || s}</span>`).join('')}
          ${folders.map(f => `<span class="tag">📁 ${esc(f)}</span>`).join('')}
          ${(v.tags || '').split(',').filter(Boolean).slice(0, 6).map(t =>
            `<span class="tag hash" onclick="byTag('${esc(t).replace(/'/g,"\\'")}')"># ${esc(t)}</span>`).join('')}
          ${v.music_title ? `<span class="tag">♪ ${esc(v.music_title)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  const pages = Math.ceil(total / limit), cur = Math.floor(offset / limit) + 1;
  $('#pager').innerHTML = pages > 1
    ? `<button ${offset ? '' : 'disabled'} onclick="go(-1)">← 上一页</button>
       <button disabled>${cur} / ${pages} （共 ${total}）</button>
       <button ${cur >= pages ? 'disabled' : ''} onclick="go(1)">下一页 →</button>`
    : `<button disabled>共 ${total} 条</button>`;
}

window.go = d => { offset = Math.max(0, offset + d * limit); loadList(); window.scrollTo({top:0}); };

window.toggleDesc = btn => {
  const el = btn.previousElementSibling;
  el.classList.toggle('open');
  btn.textContent = el.classList.contains('open') ? '收起' : '展开全文';
};

window.byAuthor = name => {
  author = author === name ? '' : name;
  $('#author').value = author;
  offset = 0; loadList();
};

window.resetAll = () => {
  q = ''; source = ''; author = ''; tag = ''; sort = 'collected'; offset = 0;
  $('#q').value = ''; $('#author').value = ''; $('#sort').value = 'collected';
  loadStats(); loadTags(); loadList();
};

window.byTag = t => { tag = (tag === t) ? '' : t; offset = 0; loadTags(); loadList(); };

async function loadAuthors(){
  const d = await api('/api/authors?limit=60');
  $('#author').innerHTML = '<option value="">全部作者</option>' +
    d.items.map(a => `<option value="${esc(a.nickname)}">${esc(a.nickname)} (${a.n})</option>`).join('');
  $('#author').value = author;
}

// 话题标签来自文案里的 #hashtag —— 零成本的分类信息
async function loadTags(){
  const d = await api('/api/tags?limit=120');
  if (!d.items.length){ $('#tag-chips').innerHTML = ''; return; }
  const shown = tagsOpen ? d.items : d.items.slice(0, 18);
  $('#tag-chips').innerHTML =
    shown.map(t =>
      `<span class="chip${tag === t.tag ? ' on' : ''}" data-tag="${esc(t.tag)}"># ${esc(t.tag)} ${t.n}</span>`
    ).join('') +
    (d.items.length > 18
      ? `<button class="more" id="tag-toggle">${tagsOpen ? '收起' : `更多 (${d.items.length - 18})`}</button>`
      : '');

  $('#tag-chips').querySelectorAll('.chip').forEach(el => {
    el.onclick = () => {
      tag = (tag === el.dataset.tag) ? '' : el.dataset.tag;  // 再点一次取消
      offset = 0; loadTags(); loadList();
    };
  });
  const t = $('#tag-toggle');
  if (t) t.onclick = () => { tagsOpen = !tagsOpen; loadTags(); };
}

async function pollRuns(){
  const d = await api('/api/runs');
  const box = $('#notices');
  box.querySelector('.run')?.remove();

  if (d.collecting){
    const p = d.progress || {};
    box.insertAdjacentHTML('beforeend',
      `<div class="notice run">采集中… 第 ${p.pages ?? 0} 页,已抓 ${p.fetched ?? 0} 条(新增 ${p.inserted ?? 0})。抖音有风控,翻页间隔是刻意留的,慢是正常的。</div>`);
    setButtons(true);
    await loadStats(); await loadList();
    if (!polling) polling = setInterval(pollRuns, 3000);
  } else {
    setButtons(false);
    if (polling){ clearInterval(polling); polling = null; await loadStats(); await loadList(); }
    const last = (d.items || [])[0];
    if (last && last.status === 'failed'){
      box.insertAdjacentHTML('beforeend',
        `<div class="notice warn">上次采集失败:${esc(last.error)}<br>已抓到的数据和游标都保留了,重新点采集会从断点续采。</div>`);
    }
  }
}

function setButtons(busy){
  ['#btn-fav','#btn-like','#btn-posts','#btn-folders'].forEach(s => $(s).disabled = busy);
}

async function trigger(url){
  setButtons(true);
  try { await api(url, {method:'POST'}); await pollRuns(); }
  catch(e){
    $('#notices').insertAdjacentHTML('beforeend', `<div class="notice warn">${esc(e.message)}</div>`);
    setButtons(false);
  }
}

$('#btn-fav').onclick     = () => trigger('/api/collect/favorites');
$('#btn-like').onclick    = () => trigger('/api/collect/likes');
$('#btn-posts').onclick   = () => trigger('/api/collect/posts');
$('#btn-reset').onclick   = () => resetAll();
$('#sort').onchange       = e => { sort = e.target.value; offset = 0; loadList(); };
$('#author').onchange     = e => { author = e.target.value; offset = 0; loadList(); };
$('#btn-folders').onclick = async () => {
  setButtons(true);
  try {
    const d = await api('/api/collect/folders/sync', {method:'POST'});
    $('#notices').insertAdjacentHTML('beforeend',
      `<div class="notice">找到 ${d.items.length} 个收藏夹:${d.items.map(f => esc(f.collects_name)).join('、') || '—'}<br>用命令行采集其中一个:<code>python backend/cli.py folder &lt;id&gt;</code></div>`);
  } catch(e){
    $('#notices').insertAdjacentHTML('beforeend', `<div class="notice warn">${esc(e.message)}</div>`);
  }
  setButtons(false);
};

let t;
$('#q').oninput = e => {
  clearTimeout(t);
  t = setTimeout(() => { q = e.target.value.trim(); offset = 0; loadList(); }, 250);
};

(async () => {
  await loadStats(); await loadAuthors(); await loadTags();
  await loadList(); await pollRuns();
})();
</script>
</body>
</html>
