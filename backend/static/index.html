<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douyin-DB · 我的收藏知识库</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232c; --line:#242c37;
    --fg:#e6edf3; --dim:#8b959e; --accent:#2f81f7; --ok:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg)}
  a{color:var(--accent);text-decoration:none}
  header{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.92);
          backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{margin:0 0 10px;font-size:17px;font-weight:600;letter-spacing:.3px}
  h1 small{color:var(--dim);font-weight:400;margin-left:8px;font-size:13px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-bottom:12px}
  .stats b{color:var(--fg);font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=search]{flex:1;min-width:200px;padding:9px 12px;border-radius:8px;
      border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:14px}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);
      background:var(--panel-2);color:var(--fg);cursor:pointer;font-size:13px}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  .notice{padding:12px 14px;border-radius:8px;margin-bottom:16px;font-size:13.5px;
      border:1px solid var(--line);background:var(--panel)}
  .notice.warn{border-color:#4a3a12;background:#241d0e;color:#e8c26a}
  .notice.run{border-color:#12304a;background:#0e1e2e;color:#84c5fb}
  .grid{display:grid;gap:10px}
  .card{display:flex;gap:12px;padding:12px;border:1px solid var(--line);
      border-radius:10px;background:var(--panel)}
  .card:hover{border-color:#313b47}
  .thumb{flex:0 0 88px;height:118px;border-radius:6px;background:var(--panel-2);
      object-fit:cover;display:block}
  .body{min-width:0;flex:1}
  .meta{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12.5px;margin-bottom:5px}
  .who{color:var(--fg);font-weight:500}
  .desc{white-space:pre-wrap;word-break:break-word;max-height:4.9em;overflow:hidden}
  .desc.empty{color:var(--dim);font-style:italic}
  .tagrow{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:20px;background:var(--panel-2);
      color:var(--dim);border:1px solid var(--line)}
  .empty-state{text-align:center;padding:64px 20px;color:var(--dim)}
  .empty-state code{background:var(--panel-2);padding:2px 7px;border-radius:5px;color:var(--fg)}
  footer{max-width:1100px;margin:0 auto;padding:0 20px 40px;display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Douyin-DB<small>抖音收藏 → 可搜索的知识库</small></h1>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="搜文案、作者、音乐名…">
    <button id="btn-fav" class="primary">采集收藏</button>
    <button id="btn-like">采集点赞</button>
    <button id="btn-folders">同步收藏夹</button>
  </div>
</div></header>

<main>
  <div id="notices"></div>
  <div class="grid" id="list"></div>
</main>
<footer id="pager"></footer>

<script>
const $  = s => document.querySelector(s);
const api = (p, o) => fetch(p, o).then(async r => {
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
  return d;
});
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let offset = 0, limit = 50, total = 0, q = '', polling = null;

// 毫秒 → m:ss（收藏里有 8 分钟以上的长视频,纯秒数读不出来）
function secs(ms){
  if (!ms) return '';
  const t = Math.round(ms/1000);
  return t < 60 ? t + 's' : `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
}

async function loadStats(){
  const [s, h] = await Promise.all([api('/api/stats'), api('/api/health')]);
  $('#stats').innerHTML =
    `<span>作品 <b>${s.total}</b></span>` +
    `<span>有文案 <b>${s.with_description}</b></span>` +
    `<span>作者 <b>${s.authors}</b></span>` +
    Object.entries(s.by_source || {}).map(([k,v]) =>
      `<span>${({collection:'收藏',like:'点赞',collects:'收藏夹'})[k]||k} <b>${v}</b></span>`).join('');

  // 用专属 class,避免把采集失败的 .warn 提示一起删掉
  const n = $('#notices');
  n.querySelector('.cookie-warn')?.remove();
  if (!h.cookie_configured){
    n.insertAdjacentHTML('afterbegin',
      `<div class="notice warn cookie-warn">还没登录。跑 <code>python backend/cli.py qrlogin</code> 扫码,或把 cookie 填进 <code>.env</code>。cookie 只存在你本机。</div>`);
  }
  return h;
}

async function loadList(){
  const d = await api(`/api/videos?limit=${limit}&offset=${offset}` + (q ? `&q=${encodeURIComponent(q)}` : ''));
  total = d.total;

  if (!d.items.length){
    $('#list').innerHTML = q
      ? `<div class="empty-state">没找到「${esc(q)}」</div>`
      : `<div class="empty-state">库还是空的。<br><br>点右上角 <code>采集收藏</code>,或命令行跑 <code>python backend/cli.py favorites</code></div>`;
    $('#pager').innerHTML = '';
    return;
  }

  $('#list').innerHTML = d.items.map(v => {
    const desc = (v.description || '').trim();
    return `<div class="card">
      ${v.cover
        ? `<img class="thumb" src="${esc(v.cover)}" referrerpolicy="no-referrer" loading="lazy"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb'}))">`
        : `<div class="thumb"></div>`}
      <div class="body">
        <div class="meta">
          <span class="who">${esc(v.nickname) || '未知作者'}</span>
          ${v.create_time ? `<span>${esc(String(v.create_time))}</span>` : ''}
          ${v.video_duration ? `<span>${secs(v.video_duration)}</span>` : ''}
          <a href="${esc(v.share_url)}" target="_blank" rel="noreferrer">打开 ↗</a>
        </div>
        <div class="desc${desc ? '' : ' empty'}">${desc ? esc(desc) : '（无文案 — 需 Phase 2 的视觉理解补全）'}</div>
        <div class="tagrow">
          <span class="tag">${({collection:'收藏',like:'点赞',collects:'收藏夹'})[v.source] || v.source}</span>
          ${v.collects_name ? `<span class="tag">${esc(v.collects_name)}</span>` : ''}
          ${v.music_title ? `<span class="tag">♪ ${esc(v.music_title)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  const pages = Math.ceil(total / limit), cur = Math.floor(offset / limit) + 1;
  $('#pager').innerHTML = pages > 1
    ? `<button ${offset ? '' : 'disabled'} onclick="go(-1)">← 上一页</button>
       <button disabled>${cur} / ${pages} （共 ${total}）</button>
       <button ${cur >= pages ? 'disabled' : ''} onclick="go(1)">下一页 →</button>`
    : `<button disabled>共 ${total} 条</button>`;
}

window.go = d => { offset = Math.max(0, offset + d * limit); loadList(); window.scrollTo({top:0}); };

async function pollRuns(){
  const d = await api('/api/runs');
  const box = $('#notices');
  box.querySelector('.run')?.remove();

  if (d.collecting){
    const p = d.progress || {};
    box.insertAdjacentHTML('beforeend',
      `<div class="notice run">采集中… 第 ${p.pages ?? 0} 页,已抓 ${p.fetched ?? 0} 条(新增 ${p.inserted ?? 0})。抖音有风控,翻页间隔是刻意留的,慢是正常的。</div>`);
    setButtons(true);
    await loadStats(); await loadList();
    if (!polling) polling = setInterval(pollRuns, 3000);
  } else {
    setButtons(false);
    if (polling){ clearInterval(polling); polling = null; await loadStats(); await loadList(); }
    const last = (d.items || [])[0];
    if (last && last.status === 'failed'){
      box.insertAdjacentHTML('beforeend',
        `<div class="notice warn">上次采集失败:${esc(last.error)}<br>已抓到的数据和游标都保留了,重新点采集会从断点续采。</div>`);
    }
  }
}

function setButtons(busy){
  ['#btn-fav','#btn-like','#btn-folders'].forEach(s => $(s).disabled = busy);
}

async function trigger(url){
  setButtons(true);
  try { await api(url, {method:'POST'}); await pollRuns(); }
  catch(e){
    $('#notices').insertAdjacentHTML('beforeend', `<div class="notice warn">${esc(e.message)}</div>`);
    setButtons(false);
  }
}

$('#btn-fav').onclick     = () => trigger('/api/collect/favorites');
$('#btn-like').onclick    = () => trigger('/api/collect/likes');
$('#btn-folders').onclick = async () => {
  setButtons(true);
  try {
    const d = await api('/api/collect/folders/sync', {method:'POST'});
    $('#notices').insertAdjacentHTML('beforeend',
      `<div class="notice">找到 ${d.items.length} 个收藏夹:${d.items.map(f => esc(f.collects_name)).join('、') || '—'}<br>用命令行采集其中一个:<code>python backend/cli.py folder &lt;id&gt;</code></div>`);
  } catch(e){
    $('#notices').insertAdjacentHTML('beforeend', `<div class="notice warn">${esc(e.message)}</div>`);
  }
  setButtons(false);
};

let t;
$('#q').oninput = e => {
  clearTimeout(t);
  t = setTimeout(() => { q = e.target.value.trim(); offset = 0; loadList(); }, 250);
};

(async () => { await loadStats(); await loadList(); await pollRuns(); })();
</script>
</body>
</html>
