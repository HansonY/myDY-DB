<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浏览 · Douyin-DB</title>
<link rel="stylesheet" href="/shell.css?v=1786286065">
<style>
/* 搜索 + 模式切换 */
.search{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
.search .box{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:0 12px}
.search .box:focus-within{border-color:var(--accent-line)}
.search .box svg{width:16px;height:16px;color:var(--dim2);flex:none}
.search input{flex:1;background:none;border:0;color:var(--fg);font-size:13px;padding:11px 0;outline:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:500;
  padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent-dim);color:var(--accent-text)}

/* 筛选行 */
.filters{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .lab{font:500 10px/1 var(--mono);letter-spacing:.8px;color:var(--dim2);
  width:52px;flex:none;text-transform:uppercase}
.chip{background:var(--surface);border:1px solid var(--line2);color:var(--dim);
  font-size:12px;font-weight:400;line-height:1.35;padding:7px 14px;border-radius:8px;
  cursor:pointer;transition:.14s var(--ease)}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent-text)}
.chip b{color:var(--dim2);font-weight:400;margin-left:5px;font-size:11px}
.chip.on b{color:var(--accent-text);opacity:.8}

.meta{display:flex;align-items:center;margin:16px 0 12px;color:#626c7c;font-size:11.5px}
.meta .gap{flex:1}
.meta select{background:var(--surface);border:1px solid var(--line);color:var(--dim);
  border-radius:7px;padding:5px 9px;font-size:11.5px}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;transition:border-color .14s var(--ease)}
.card:hover{border-color:var(--line2)}
.thumb{position:relative;aspect-ratio:3/4;background:var(--surface2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim2);font-size:11px}
.thumb .cred{position:absolute;top:8px;left:8px}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(10,12,15,.78);
  color:#c8ced8;font-size:10px;font-weight:500;line-height:1;padding:3px 6px;border-radius:4px}
.card .info{padding:10px 11px 12px}
.card .ttl{font-size:12px;font-weight:500;line-height:18.6px;color:#d5dae2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.card .by{margin-top:7px;display:flex;gap:8px;align-items:center;color:#4e5866;font-size:10.5px}
.card .by .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .by .digg{margin-left:auto;flex:none;font-family:var(--mono)}
.card a.open{color:inherit}

/* 底部「没内容」提示条 */
.warnbar{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border:1px solid var(--warn-line);background:var(--warn-dim);border-radius:10px;padding:13px 16px}
.warnbar p{margin:0;font-size:12px;color:var(--fg);line-height:1.65;flex:1;min-width:240px}
.warnbar b{color:var(--warn-text)}
.warnbar .btn{border-color:var(--warn-line);color:var(--warn-text);background:transparent;flex:none}
.warnbar .btn:hover{background:rgba(255,122,69,.14)}

.more{display:block;margin:22px auto 0;}
.skel{color:var(--dim2);text-align:center;padding:50px 0}
.score{font:11px/1 var(--mono);color:var(--ok);margin-left:6px}
</style>

<div class="wrap wide">
  <div class="search">
    <label class="box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜文案、内容总结、逐字稿、作者…" autocomplete="off">
    </label>
    <div class="seg">
      <button id="m-lit" class="on">字面搜</button>
      <button id="m-sem">换句话也能搜</button>
    </div>
  </div>

  <div class="filters">
    <div class="frow" id="f-source"><span class="lab">来源</span></div>
    <div class="frow" id="f-cred"><span class="lab">可信度</span></div>
    <div class="frow" id="f-tag"><span class="lab">话题</span></div>
  </div>

  <div class="meta">
    <span id="count">…</span>
    <span class="gap"></span>
    <select id="sort">
      <option value="collected">按存入时间</option>
      <option value="digg">按点赞</option>
      <option value="create">按发布时间</option>
    </select>
  </div>

  <div id="grid" class="grid"><div class="skel">读取中…</div></div>
  <div id="tail"></div>
</div>

<script src="/shell.js?v=1786286065"></script>
<script>
'use strict';
mountNav('browse');

// 来源用人话,值是库里的真实 source。「博主发的」= 我关注但没主动存的。
const SOURCES = [
  {v: '',           label: '全部'},
  {v: 'collection', label: '我收藏的'},
  {v: 'like',       label: '我点赞的'},
  {v: 'post',       label: '我发布的'},
  {v: 'following',  label: '博主发的'},
];
// 可信度对应 content_state。这是「这条到底有没有真内容」的三态,不是随便的标签。
const CREDS = [
  {v: '',        label: '不限'},
  {v: 'have',    label: '有内容总结'},
  {v: 'none',    label: '只有文案'},
  {v: 'unknown', label: '还没采全'},
];

let mode = 'lit';           // lit=字面 | sem=语义
let source = '', cred = '', sort = 'collected', q = '', tag = '';
let TAGS = [], tagsOpen = false;
const TAG_FOLD = 14;        // 默认露这么多,其余折起来 —— 全展开有 100+ 个,会淹掉卡片
let offset = 0, total = 0, loading = false;
const LIMIT = 60;
let counts = {};            // 各来源/可信度的条数,填在 chip 上

function credOf(v) {
  // have→抖音总结(蓝) · 其余→只有文案(橙)。浏览页只按 content_state 分两档:
  // 「本地转写」需要逐字稿标记,列表接口没带,不在这里假装有。
  return v.content_state === 'have'
    ? {cls: 'summary', label: '抖音总结'}
    : {cls: 'desc', label: '只有文案'};
}

function chips() {
  $('#f-source').innerHTML = '<span class="lab">来源</span>' + SOURCES.map(s =>
    `<button class="chip${source === s.v ? ' on' : ''}" data-src="${s.v}">${s.label}` +
    `${counts.src && counts.src[s.v] != null ? `<b>${fmt(counts.src[s.v])}</b>` : ''}</button>`).join('');
  $('#f-cred').innerHTML = '<span class="lab">可信度</span>' + CREDS.map(c =>
    `<button class="chip${cred === c.v ? ' on' : ''}" data-cred="${c.v}">${c.label}` +
    `${counts.cred && counts.cred[c.v] != null ? `<b>${fmt(counts.cred[c.v])}</b>` : ''}</button>`).join('');

  // 话题标签。默认只露前 14 个 —— 全部有 100+,铺开会把卡片挤到屏幕外。
  const shown = tagsOpen ? TAGS : TAGS.slice(0, TAG_FOLD);
  const restN = TAGS.length - shown.length;
  $('#f-tag').innerHTML = '<span class="lab">话题</span>'
    + `<button class="chip${!tag ? ' on' : ''}" data-tag="">不限</button>`
    + shown.map(t =>
        `<button class="chip${tag === t.tag ? ' on' : ''}" data-tag="${esc(t.tag)}">` +
        `#${esc(t.tag)}<b>${fmt(t.n)}</b></button>`).join('')
    + (restN > 0
        ? `<button class="chip" data-more="1">+${restN} 个话题</button>`
        : TAGS.length > TAG_FOLD ? `<button class="chip" data-more="1">收起</button>` : '');
}

function card(v) {
  const title = v.item_title || v.description || '(无标题)';
  const c = credOf(v);
  const cover = `/api/cover/${v.aweme_id}`;
  const score = v._score != null ? `<span class="score">${v._score}</span>` : '';
  return `<div class="card"><a class="open" href="${esc(v.share_url || '#')}" target="_blank" rel="noopener">
    <div class="thumb">
      <img src="${cover}" loading="lazy" onerror="this.style.display='none'">
      <span class="ph">封面</span>
      <span class="cred ${c.cls}">${c.label}</span>
      ${v.video_duration ? `<span class="dur">${dur(v.video_duration)}</span>` : ''}
    </div>
    <div class="info">
      <div class="ttl">${esc(title)}${score}</div>
      <div class="by"><span class="who">${esc(v.nickname || '')}</span>
        <span class="digg">♥ ${fmt(v.digg_count)}</span></div>
    </div></a></div>`;
}

async function loadCounts() {
  // 各 chip 的条数:并发问一遍(轻,只要 total)。全部那格用总数。
  try {
    const base = await api('/api/videos?limit=1');
    counts.src = {'': base.total}; counts.cred = {'': base.total};
    await Promise.all([
      ...SOURCES.filter(s => s.v).map(s =>
        api(`/api/videos?limit=1&source=${s.v}`).then(r => counts.src[s.v] = r.total)),
      ...CREDS.filter(c => c.v).map(c =>
        api(`/api/videos?limit=1&content=${c.v}`).then(r => counts.cred[c.v] = r.total)),
    ]);
  } catch (e) { /* 数字拿不到不影响筛选 */ }
  chips();
}

async function run(reset) {
  if (loading) return;
  loading = true;
  if (reset) { offset = 0; $('#grid').innerHTML = '<div class="skel">读取中…</div>'; }

  try {
    if (mode === 'sem' && q) {
      // 语义搜:走 /api/search,默认只搜「我的」,把命中拍平成卡片
      const r = await api(`/api/search?q=${encodeURIComponent(q)}&limit=30&scope=all`);
      const hits = [...(r.good || []), ...(r.maybe || [])];
      total = hits.length;
      $('#count').innerHTML = hits.length
        ? `换句话找到 ${hits.length} 条 · <span class="dim">相关度已标在角上</span>`
        : `没找到相关的 · <span class="dim">${(r.nearest_below || []).join(' / ') || ''}</span>`;
      $('#grid').innerHTML = hits.map(h => card({
        aweme_id: h.aweme_id, item_title: h.title, nickname: h.author,
        digg_count: h.digg_count, share_url: h.url, content_state: 'have',
        video_duration: 0, _score: h.score,
      })).join('') || '<div class="empty">换个说法试试</div>';
      $('#tail').innerHTML = '';
      loading = false; return;
    }

    const p = new URLSearchParams({limit: LIMIT, offset, sort});
    if (q) p.set('q', q);
    if (source) p.set('source', source);
    if (cred) p.set('content', cred);
    if (tag) p.set('tag', tag);
    const r = await api('/api/videos?' + p);
    total = r.total;
    $('#count').textContent = `${fmt(total)} 条` + (q ? ` · 含「${q}」` : '');
    const cards = r.items.map(card).join('');
    if (reset) $('#grid').innerHTML = cards || '<div class="empty">没有匹配的</div>';
    else $('#grid').insertAdjacentHTML('beforeend', cards);
    offset += r.items.length;
    renderTail();
  } catch (e) {
    $('#grid').innerHTML = `<div class="empty"><b>读取失败</b>${esc(e.message)}</div>`;
  }
  loading = false;
}

function renderTail() {
  let html = '';
  if (offset < total) html += `<button class="btn more" id="more">再看 ${Math.min(LIMIT, total - offset)} 条</button>`;
  // 底部提示条:多少条其实没有真内容 —— 只在「不限可信度」时提示,别在已筛选时误导
  if (!cred && counts.cred && counts.cred.have != null) {
    const noContent = total - (counts.cred.have || 0);
    if (noContent > 0) html += `<div class="warnbar">
      <p><b>${fmt(counts.cred.none)} 条只有作者文案、没有真实内容</b> —— 搜不到、也问不到。
        补齐它们要跑本地语音转写,把「视频里说了什么」变成能搜的文字。</p>
      <a class="btn" href="/data.html">去维护里转写 →</a></div>`;
  }
  $('#tail').innerHTML = html;
  const m = $('#more'); if (m) m.onclick = () => run(false);
}

// ── 交互 ──
$('#f-source').addEventListener('click', e => {
  const b = e.target.closest('[data-src]'); if (!b) return;
  source = b.dataset.src; chips(); run(true);
});
$('#f-cred').addEventListener('click', e => {
  const b = e.target.closest('[data-cred]'); if (!b) return;
  cred = b.dataset.cred; chips(); run(true);
});
$('#f-tag').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) { tagsOpen = !tagsOpen; chips(); return; }
  const b = e.target.closest('[data-tag]'); if (!b) return;
  tag = b.dataset.tag; chips(); run(true);
});
$('#sort').addEventListener('change', e => { sort = e.target.value; run(true); });
$('#m-lit').onclick = () => { mode = 'lit'; $('#m-lit').classList.add('on'); $('#m-sem').classList.remove('on'); run(true); };
$('#m-sem').onclick = () => { mode = 'sem'; $('#m-sem').classList.add('on'); $('#m-lit').classList.remove('on'); if (q) run(true); };
let t;
$('#q').addEventListener('input', e => {
  q = e.target.value.trim();
  if (mode === 'sem') return;              // 语义搜按回车,不即时
  clearTimeout(t); t = setTimeout(() => run(true), 250);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && mode === 'sem') run(true); });

// 顶栏同步时间:拿最近一次采集
api('/api/runs?limit=1').then(r => {
  const last = (r.items && r.items[0] && (r.items[0].finished_at || r.items[0].started_at));
  navSync(last);
}).catch(() => navSync());

chips();
loadCounts();
api('/api/tags?limit=120').then(r => { TAGS = r.items || []; chips(); }).catch(() => {});
run(true);
</script>
