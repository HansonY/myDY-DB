<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douyin-DB · 我的收藏知识库</title>
<style>
/* ─────────────────────────────────────────────────────────────
   设计取向:数据是竖屏封面 + 中短文案 + 大量话题标签。
   所以给两种视图 —— 列表(读文案)与网格(扫封面),默认列表。
   配色取抖音的青/品红做点缀,但只用在交互态上,不铺面积。
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#0a0c0f;
  --bg-soft:#0e1116;
  --panel:#14181e;
  --panel-2:#1b2028;
  --panel-3:#232935;
  --line:#232a34;
  --line-soft:#1a2027;
  --fg:#e9eef4;
  --fg-2:#b3bdc9;
  --dim:#7d8794;
  --dim-2:#5b6472;
  --cyan:#25f4ee;
  --pink:#fe2c55;
  --accent:#4c9dff;
  --radius:14px;
  --shadow:0 6px 24px -8px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
::selection{background:rgba(37,244,238,.25)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31394a}

/* ── 顶栏 ───────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(10,12,15,.97),rgba(10,12,15,.93));
  backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line-soft);
}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
.top{display:flex;align-items:center;gap:14px;padding:15px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand h1{
  margin:0;font-size:17px;font-weight:650;letter-spacing:-.2px;
  background:linear-gradient(96deg,var(--cyan),#7fd0ff 45%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand span{color:var(--dim-2);font-size:12.5px;letter-spacing:.2px}

.kpis{display:flex;gap:16px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;line-height:1.25}
.kpi b{font-size:16px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi i{font-style:normal;font-size:11px;color:var(--dim-2);letter-spacing:.4px}

/* ── 控件 ───────────────────────────────────────────────── */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.pad{padding-bottom:11px}

.search{position:relative;flex:1;min-width:210px}
.search input{
  width:100%;padding:10px 13px 10px 34px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font-size:14px;transition:border-color .15s,box-shadow .15s;
}
.search input::placeholder{color:var(--dim-2)}
.search input:focus{
  outline:none;border-color:rgba(37,244,238,.55);
  box-shadow:0 0 0 3px rgba(37,244,238,.09);
}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--dim-2);pointer-events:none}

button,select{font-family:inherit}
.btn{
  padding:9px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--fg-2);cursor:pointer;font-size:13px;
  white-space:nowrap;transition:all .15s;
}
.btn:hover:not(:disabled){border-color:var(--panel-3);color:var(--fg);background:var(--panel-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{
  background:linear-gradient(135deg,#2f8cff,#4c9dff);border-color:transparent;
  color:#fff;font-weight:530;box-shadow:0 3px 12px -4px rgba(76,157,255,.6);
}
.btn.go:hover:not(:disabled){filter:brightness(1.09)}

select{
  padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--fg-2);font-size:12.5px;max-width:200px;
  cursor:pointer;
}
select:focus{outline:none;border-color:var(--panel-3)}

.chip{
  padding:5px 11px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);cursor:pointer;font-size:12.5px;
  white-space:nowrap;transition:all .14s;user-select:none;
}
.chip:hover{border-color:var(--panel-3);color:var(--fg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.65;margin-left:3px}
.chip.on{
  background:rgba(76,157,255,.14);border-color:rgba(76,157,255,.55);color:#a8ccff;
}
.chip.tg.on{
  background:rgba(254,44,85,.13);border-color:rgba(254,44,85,.5);color:#ff9ab0;
}
.divider{width:1px;height:19px;background:var(--line);margin:0 2px}
.link{background:none;border:none;color:var(--accent);cursor:pointer;
  font-size:12.5px;padding:3px 5px;font-family:inherit}
.link:hover{text-decoration:underline}

.tagbar{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px;align-items:center}

/* 视图切换 */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{
  padding:7px 12px;background:var(--panel);border:none;color:var(--dim);
  cursor:pointer;font-size:12.5px;transition:all .14s;
}
.seg button.on{background:var(--panel-3);color:var(--fg)}
.seg button+button{border-left:1px solid var(--line)}

/* ── 提示条 ─────────────────────────────────────────────── */
main{max-width:1240px;margin:0 auto;padding:20px 22px 72px}
.notice{
  padding:12px 15px;border-radius:12px;margin-bottom:14px;font-size:13.5px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg-2);
  display:flex;gap:10px;align-items:flex-start;line-height:1.55;
}
.notice code{background:var(--panel-3);padding:1.5px 6px;border-radius:5px;
  font-size:12.5px;color:var(--fg)}
.notice.warn{border-color:#4d3a10;background:#221a09;color:#ecc776}
.notice.run{border-color:#123a45;background:#0a1e24;color:#8fdce6}
.notice .ic{flex:0 0 auto;font-size:14px;line-height:1.5}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(143,220,230,.3);border-top-color:#8fdce6;
  animation:sp .7s linear infinite;margin-top:3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 列表视图 ───────────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:11px}
.card{
  display:flex;gap:14px;padding:13px;border:1px solid var(--line-soft);
  border-radius:var(--radius);background:var(--panel);
  transition:border-color .16s,background .16s,transform .16s;
}
.card:hover{border-color:var(--panel-3);background:var(--panel-2)}

.cover{
  position:relative;flex:0 0 92px;height:123px;border-radius:10px;
  overflow:hidden;background:var(--panel-2);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .dur{
  position:absolute;right:4px;bottom:4px;padding:1px 5px;border-radius:5px;
  background:rgba(0,0,0,.72);color:#fff;font-size:10.5px;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--dim-2);font-size:18px}

.body{min-width:0;flex:1;display:flex;flex-direction:column}
.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  color:var(--dim);font-size:12.5px;margin-bottom:6px}
.who{color:var(--fg);font-weight:530;cursor:pointer;transition:color .14s}
.who:hover{color:var(--cyan)}
.dot{color:var(--dim-2)}
.open{margin-left:auto;color:var(--dim);font-size:12px;transition:color .14s}
.open:hover{color:var(--accent)}

.desc{white-space:pre-wrap;word-break:break-word;color:var(--fg-2);
  max-height:4.95em;overflow:hidden;font-size:14px;line-height:1.65}
.desc.open{max-height:none}
.desc.none{color:var(--dim-2);font-style:italic;font-size:13px}

.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel-2);
  color:var(--dim);border:1px solid var(--line-soft);white-space:nowrap}
.pill.src{background:rgba(76,157,255,.1);border-color:rgba(76,157,255,.25);color:#96c2ff}
.pill.hash{cursor:pointer;transition:all .14s}
.pill.hash:hover{color:#ff9ab0;border-color:rgba(254,44,85,.45);background:rgba(254,44,85,.09)}
.pill.mus{color:var(--dim-2)}

/* ── 网格视图 ───────────────────────────────────────────── */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.gcard{
  border-radius:var(--radius);overflow:hidden;background:var(--panel);
  border:1px solid var(--line-soft);cursor:pointer;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.gcard:hover{transform:translateY(-3px);border-color:var(--panel-3);box-shadow:var(--shadow)}
.gcover{position:relative;aspect-ratio:9/13;background:var(--panel-2);overflow:hidden}
.gcover img{width:100%;height:100%;object-fit:cover;display:block}
.gcover::after{
  content:"";position:absolute;inset:auto 0 0 0;height:62%;
  background:linear-gradient(to top,rgba(8,10,13,.95),rgba(8,10,13,.55) 45%,transparent);
}
.gcover .dur{
  position:absolute;right:6px;top:6px;padding:2px 6px;border-radius:6px;
  background:rgba(0,0,0,.66);color:#fff;font-size:10.5px;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(3px);z-index:2;
}
.gtitle{
  position:absolute;left:0;right:0;bottom:0;padding:9px 10px;z-index:2;
  font-size:12.5px;line-height:1.45;color:#f2f6fa;
  /* 三行截断。只靠 -webkit-line-clamp 不可靠 —— 加了 overflow:hidden 后
     Chrome 把 display 归一成 flow-root,clamp 直接失效(实测渗出第 4 行)。
     所以用 max-height 硬兜底,不依赖浏览器是否保留 -webkit-box。 */
  display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:3;line-clamp:3;
  /* box-sizing 是 border-box,max-height 会把 18px 内边距算进去 ——
     不加上它第 3 行会被横切一半,比截断更难看。 */
  max-height:calc(1.45em * 3 + 18px);
  overflow:hidden;
  /* clamp 失效意味着没有省略号,文字是硬切的。用渐隐收尾,让截断看起来是刻意的。 */
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 15px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 15px),transparent);
}
.gfoot{padding:8px 10px 9px;display:flex;flex-direction:column;gap:4px}
.gwho{font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtime{font-size:10.5px;color:var(--dim-2);font-variant-numeric:tabular-nums}

/* ── 骨架屏 / 空态 / 分页 ───────────────────────────────── */
.sk{background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 50%,var(--panel) 75%);
  background-size:200% 100%;animation:shim 1.3s infinite;border-radius:var(--radius);height:150px}
@keyframes shim{to{background-position:-200% 0}}

.empty{text-align:center;padding:80px 20px;color:var(--dim)}
.empty .big{font-size:34px;margin-bottom:14px;opacity:.5}
.empty code{background:var(--panel-2);padding:2px 7px;border-radius:6px;color:var(--fg)}

footer{max-width:1240px;margin:0 auto;padding:26px 22px 48px;
  display:flex;gap:9px;justify-content:center;align-items:center}
.page{padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--fg-2);cursor:pointer;font-size:13px}
.page:hover:not(:disabled){border-color:var(--panel-3);color:var(--fg)}
.page:disabled{opacity:.4;cursor:default}
.page.info{background:none;border:none;color:var(--dim);font-variant-numeric:tabular-nums}

@media(max-width:640px){
  .wrap,main,footer{padding-left:14px;padding-right:14px}
  .kpis{gap:12px}
  .kpi b{font-size:14px}
  .cover{flex-basis:74px;height:99px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .brand span{display:none}
}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Douyin-DB</h1>
      <span>抖音收藏 → 可搜索的知识库</span>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="row pad">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input type="search" id="q" placeholder="搜文案、作者、音乐名…">
    </label>
    <button class="btn go" id="b-fav">采集收藏</button>
    <button class="btn" id="b-like">点赞</button>
    <button class="btn" id="b-post">我的作品</button>
    <button class="btn" id="b-fold">收藏夹</button>
  </div>

  <div class="row pad">
    <span class="row" id="srcs" style="gap:6px"></span>
    <span class="divider"></span>
    <select id="sort">
      <option value="collected">存入时间</option>
      <option value="published">发布时间</option>
      <option value="duration">时长</option>
      <option value="author">作者</option>
    </select>
    <select id="author"><option value="">全部作者</option></select>
    <div class="seg" style="margin-left:auto">
      <button id="v-list" class="on">列表</button>
      <button id="v-grid">网格</button>
    </div>
    <button class="chip" id="b-reset">重置</button>
  </div>

  <div class="tagbar" id="tags"></div>
</div></header>

<main>
  <div id="notices"></div>
  <div id="out"></div>
</main>
<footer id="pager"></footer>

<script>
const $ = s => document.querySelector(s);
const api = (p,o) => fetch(p,o).then(async r => {
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
  return d;
});
const esc = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jsq = s => esc(s).replace(/'/g,"\\'");

const SRC = {collection:'收藏', like:'点赞', post:'我的作品', collects:'收藏夹'};

let offset=0, limit=50, total=0;
let q='', source='', sort='collected', author='', tag='';
let view = localStorage.getItem('dydb.view') || 'list';
let tagsOpen=false, polling=null;

/* 时长:既有 30 秒短视频,也有 8 分钟长视频和 24 小时直播回放,
   三种量级都要读得出来 */
function dur(ms){
  if(!ms) return '';
  const t = Math.round(ms/1000);
  if(t < 60)   return t+'s';
  if(t < 3600) return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  const h = Math.floor(t/3600);
  return h < 24 ? `${h}h${String(Math.floor(t%3600/60)).padStart(2,'0')}` : 'LIVE';
}
const day = s => (s||'').slice(0,10);

function qs(){
  const p = new URLSearchParams({limit, offset, sort});
  if(q) p.set('q',q);
  if(source) p.set('source',source);
  if(author) p.set('nickname',author);
  if(tag) p.set('tag',tag);
  return p.toString();
}

/* ── 顶部指标 + 来源筛选 ─────────────────────────────── */
async function loadStats(){
  const [s,h] = await Promise.all([api('/api/stats'), api('/api/health')]);

  $('#kpis').innerHTML = [
    ['作品', s.total], ['有文案', s.with_description], ['作者', s.authors],
  ].map(([k,v]) => `<div class="kpi"><b>${v.toLocaleString()}</b><i>${k}</i></div>`).join('');

  const es = Object.entries(s.by_source||{});
  $('#srcs').innerHTML =
    `<span class="chip${source?'':' on'}" data-s="">全部<span class="n">${s.total}</span></span>` +
    es.map(([k,v]) => `<span class="chip${source===k?' on':''}" data-s="${k}">${SRC[k]||k}<span class="n">${v}</span></span>`).join('');
  $('#srcs').querySelectorAll('.chip').forEach(el => el.onclick = () => {
    source = el.dataset.s; offset=0; loadStats(); loadList();
  });

  const box = $('#notices');
  box.querySelector('.ck')?.remove();
  if(!h.cookie_configured){
    box.insertAdjacentHTML('afterbegin',
      `<div class="notice warn ck"><span class="ic">🔑</span><div>还没登录。跑 <code>python backend/cli.py qrlogin</code> 扫码,cookie 只存在你本机。</div></div>`);
  }
}

/* ── 话题标签(来自文案里的 #hashtag,零成本分类)──────── */
async function loadTags(){
  const d = await api('/api/tags?limit=120');
  if(!d.items.length){ $('#tags').innerHTML=''; return; }
  const shown = tagsOpen ? d.items : d.items.slice(0,16);
  $('#tags').innerHTML = shown.map(t =>
      `<span class="chip tg${tag===t.tag?' on':''}" data-t="${esc(t.tag)}">#${esc(t.tag)}<span class="n">${t.n}</span></span>`).join('')
    + (d.items.length>16 ? `<button class="link" id="t-more">${tagsOpen?'收起':`+${d.items.length-16} 个标签`}</button>` : '');

  $('#tags').querySelectorAll('.chip').forEach(el => el.onclick = () => {
    tag = tag===el.dataset.t ? '' : el.dataset.t;   // 再点取消
    offset=0; loadTags(); loadList();
  });
  const m = $('#t-more');
  if(m) m.onclick = () => { tagsOpen=!tagsOpen; loadTags(); };
}

async function loadAuthors(){
  const d = await api('/api/authors?limit=60');
  $('#author').innerHTML = '<option value="">全部作者</option>' +
    d.items.map(a=>`<option value="${esc(a.nickname)}">${esc(a.nickname)} · ${a.n}</option>`).join('');
  $('#author').value = author;
}

/* ── 卡片 ───────────────────────────────────────────── */
/* 封面走 /api/cover 代理:抖音 CDN 防盗链 + URL 带 x-expires 会过期,
   服务端拉一次并永久缓存。取不到就退化成占位块,时长角标保留。 */
window.coverFail = img => {
  const box = img.parentNode;
  img.remove();
  box.insertAdjacentHTML('afterbegin', '<div class="ph">▨</div>');
};

function coverEl(v, cls){
  const d = v.video_duration ? `<span class="dur">${dur(v.video_duration)}</span>` : '';
  return v.cover
    ? `<div class="${cls}"><img src="/api/cover/${encodeURIComponent(v.aweme_id)}"
         loading="lazy" alt="" onerror="coverFail(this)">${d}</div>`
    : `<div class="${cls}"><div class="ph">▨</div>${d}</div>`;
}

function listCard(v){
  const desc = (v.description||'').trim();
  const long = desc.length>150 || desc.split('\n').length>3;
  const srcs = (v.sources||'').split(',').filter(Boolean);
  const folders = (v.folders||'').split(',').filter(Boolean);
  const hs = (v.tags||'').split(',').filter(Boolean).slice(0,6);
  return `<article class="card">
    ${coverEl(v,'cover')}
    <div class="body">
      <div class="meta">
        <span class="who" onclick="byAuthor('${jsq(v.nickname)}')">${esc(v.nickname)||'未知作者'}</span>
        <span class="dot">·</span><span>${esc(day(v.create_time))}</span>
        <a class="open" href="${esc(v.share_url)}" target="_blank" rel="noreferrer">抖音打开 ↗</a>
      </div>
      <div class="desc${desc?'':' none'}">${desc?esc(desc):'（无文案）'}</div>
      ${long?`<button class="link" style="align-self:flex-start" onclick="tg(this)">展开全文</button>`:''}
      <div class="pills">
        ${srcs.map(s=>`<span class="pill src">${SRC[s]||s}</span>`).join('')}
        ${folders.map(f=>`<span class="pill">📁 ${esc(f)}</span>`).join('')}
        ${hs.map(t=>`<span class="pill hash" onclick="byTag('${jsq(t)}')">#${esc(t)}</span>`).join('')}
        ${v.music_title?`<span class="pill mus">♪ ${esc(v.music_title)}</span>`:''}
      </div>
    </div>
  </article>`;
}

/* 网格卡:标题压在封面渐变上,所以封面要包一层相对定位容器 */
function gridWrap(v){
  const desc = (v.description||'').trim();
  return `<article class="gcard" onclick="window.open('${esc(v.share_url)}','_blank')">
    <div style="position:relative">
      ${coverEl(v,'gcover')}
      ${desc?`<div class="gtitle">${esc(desc)}</div>`:''}
    </div>
    <div class="gfoot">
      <span class="gwho">${esc(v.nickname)||'未知作者'}</span>
      <span class="gtime">${esc(day(v.create_time))}</span>
    </div>
  </article>`;
}

async function loadList(){
  if(!$('#out').innerHTML){
    $('#out').innerHTML = `<div class="list">${'<div class="sk"></div>'.repeat(6)}</div>`;
  }
  const d = await api('/api/videos?'+qs());
  total = d.total;

  if(!d.items.length){
    $('#out').innerHTML = (q||source||author||tag)
      ? `<div class="empty"><div class="big">🔍</div>当前条件下没有结果<br><button class="link" onclick="resetAll()">清空筛选</button></div>`
      : `<div class="empty"><div class="big">📥</div>库还是空的<br><br>点右上角 <code>采集收藏</code>,或命令行 <code>python backend/cli.py favorites</code></div>`;
    $('#pager').innerHTML=''; return;
  }

  $('#out').innerHTML = view==='grid'
    ? `<div class="grid">${d.items.map(gridWrap).join('')}</div>`
    : `<div class="list">${d.items.map(listCard).join('')}</div>`;

  const pages = Math.ceil(total/limit), cur = Math.floor(offset/limit)+1;
  $('#pager').innerHTML = pages>1
    ? `<button class="page" ${offset?'':'disabled'} onclick="go(-1)">← 上一页</button>
       <span class="page info">${cur} / ${pages} · 共 ${total.toLocaleString()} 条</span>
       <button class="page" ${cur>=pages?'disabled':''} onclick="go(1)">下一页 →</button>`
    : `<span class="page info">共 ${total.toLocaleString()} 条</span>`;
}

/* ── 交互 ───────────────────────────────────────────── */
window.go = d => { offset=Math.max(0,offset+d*limit); loadList(); scrollTo({top:0,behavior:'smooth'}); };
window.tg = b => {
  const el = b.previousElementSibling;
  el.classList.toggle('open');
  b.textContent = el.classList.contains('open') ? '收起' : '展开全文';
};
window.byAuthor = n => { author = author===n?'':n; $('#author').value=author; offset=0; loadList(); };
window.byTag = t => { tag = tag===t?'':t; offset=0; loadTags(); loadList(); };
window.resetAll = () => {
  q=source=author=tag=''; sort='collected'; offset=0;
  $('#q').value=''; $('#author').value=''; $('#sort').value='collected';
  loadStats(); loadTags(); loadList();
};

function setView(v){
  view=v; localStorage.setItem('dydb.view',v);
  $('#v-list').classList.toggle('on', v==='list');
  $('#v-grid').classList.toggle('on', v==='grid');
  loadList();
}

function busy(b){ ['#b-fav','#b-like','#b-post','#b-fold'].forEach(s=>$(s).disabled=b); }

async function pollRuns(){
  const d = await api('/api/runs');
  const box = $('#notices');
  box.querySelector('.rn')?.remove();

  if(d.collecting){
    const p = d.progress||{};
    box.insertAdjacentHTML('beforeend',
      `<div class="notice run rn"><span class="spin"></span><div>采集中 · 第 ${p.pages??0} 页 · 已抓 ${p.fetched??0} 条(新增 ${p.inserted??0})<br>
       <span style="opacity:.72">抖音有风控,翻页间隔是刻意留的,慢是正常的。</span></div></div>`);
    busy(true);
    await loadStats(); await loadList();
    if(!polling) polling = setInterval(pollRuns, 3000);
  }else{
    busy(false);
    if(polling){ clearInterval(polling); polling=null; await loadStats(); await loadTags(); await loadList(); }
    const last = (d.items||[])[0];
    if(last && last.status==='failed'){
      box.insertAdjacentHTML('beforeend',
        `<div class="notice warn rn"><span class="ic">⚠️</span><div>上次采集中断:${esc(last.error)}<br>
         <span style="opacity:.8">已抓到的数据和游标都保留了,重新点采集会从断点续采。</span></div></div>`);
    }
  }
}

async function trigger(url){
  busy(true);
  try{ await api(url,{method:'POST'}); await pollRuns(); }
  catch(e){
    $('#notices').insertAdjacentHTML('beforeend',
      `<div class="notice warn"><span class="ic">⚠️</span><div>${esc(e.message)}</div></div>`);
    busy(false);
  }
}

$('#b-fav').onclick  = () => trigger('/api/collect/favorites');
$('#b-like').onclick = () => trigger('/api/collect/likes');
$('#b-post').onclick = () => trigger('/api/collect/posts');
$('#b-fold').onclick = async () => {
  busy(true);
  try{
    const d = await api('/api/collect/folders/sync',{method:'POST'});
    $('#notices').insertAdjacentHTML('beforeend',
      `<div class="notice"><span class="ic">📁</span><div>${d.items.length
        ? `找到 ${d.items.length} 个收藏夹:${d.items.map(f=>esc(f.collects_name)).join('、')}<br>
           采集其中一个:<code>python backend/cli.py folder &lt;id&gt;</code>`
        : '没有自定义收藏夹。'}</div></div>`);
  }catch(e){
    $('#notices').insertAdjacentHTML('beforeend',
      `<div class="notice warn"><span class="ic">⚠️</span><div>${esc(e.message)}</div></div>`);
  }
  busy(false);
};
$('#b-reset').onclick = resetAll;
$('#v-list').onclick  = () => setView('list');
$('#v-grid').onclick  = () => setView('grid');
$('#sort').onchange   = e => { sort=e.target.value; offset=0; loadList(); };
$('#author').onchange = e => { author=e.target.value; offset=0; loadList(); };

let t;
$('#q').oninput = e => {
  clearTimeout(t);
  t = setTimeout(()=>{ q=e.target.value.trim(); offset=0; loadList(); }, 250);
};

(async()=>{
  setView(view);
  await loadStats(); await loadAuthors(); await loadTags();
  await loadList(); await pollRuns();
})();
</script>
</body>
</html>
