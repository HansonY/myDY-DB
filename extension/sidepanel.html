<meta charset="utf-8">
<style>
:root{--bg:#0a0c0f;--surface:#12151a;--line:#1e242d;--line2:#242a33;
  --fg:#e9ecf1;--fg-hi:#f2f5f9;--dim:#8b93a1;--dim2:#4e5866;
  --accent:#4c8dff;--accent-t:#7fb0ff;--accent-dim:rgba(76,141,255,.14);
  --warn:#ff7a45;--ok:#5cb87a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 -apple-system,"PingFang SC",sans-serif;padding:0 13px 24px}

/* ⚠️ 别用负 margin 收紧间距 —— 以前 #astat/-4px、#pickinfo/-3px 这么干过,
   窄侧边栏里文字一换行就压到上一个元素上。要收紧就调上一个元素的 margin-bottom。 */

/* ── 顶部:标题 + 知识库入口 ──
   面板只管抓数据。提取、检索、分析都在知识库那一页做,这里只留一个入口。 */
.top{display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.top h1{margin:0;font-size:13.5px;font-weight:600;flex:1 1 auto}
.top a{font-size:11px;color:var(--accent-t);text-decoration:none;cursor:pointer;
  border:1px solid rgba(76,141,255,.3);border-radius:6px;padding:4px 9px;white-space:nowrap}
.top a:hover{background:var(--accent-dim)}

/* ── 统计:一眼看到干到哪儿了 ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
.stats div{border:1px solid var(--line);border-radius:8px;background:var(--surface);
  padding:8px 4px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.15}
.stats span{font-size:9.5px;color:var(--dim2)}
.stats .w{border-color:rgba(255,122,69,.32);background:rgba(255,122,69,.07)}
.stats .w b{color:var(--warn)}
.stats .g b{color:var(--ok)}

/* ── 当前页 ── */
.now{border:1px solid var(--line);border-radius:8px;background:var(--surface);
  padding:9px 10px;margin-bottom:12px}
.now .k{font-size:9.5px;color:var(--dim2);margin-bottom:3px}
.now .k.yes{color:var(--ok)}
.now .t{font-size:12.5px;font-weight:600;color:var(--fg-hi);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now .m{font-size:10px;color:var(--dim2);font-family:var(--mono);margin-top:2px}

.hd{display:flex;align-items:baseline;gap:6px;margin:0 0 7px}
.hd b{font-size:11px;font-weight:600;color:var(--dim)}
.hd span{font-size:9.5px;color:var(--dim2);margin-left:auto}

/* ── 开关 ── */
label.sw{display:flex;align-items:flex-start;gap:7px;cursor:pointer;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  padding:8px 10px;margin-bottom:6px}
label.sw input{accent-color:var(--accent);margin:1px 0 0;flex:0 0 auto}
label.sw b{display:block;font-size:12px;font-weight:500;color:var(--fg)}
label.sw i{display:block;font-style:normal;font-size:10px;color:var(--dim2);
  line-height:1.45;margin-top:1px}

/* ── 动作按钮:名字在上,这一步到底干什么在下。
   「一个按钮 + 一个勾选框」看不出会发生什么 —— 所以三种抓法各自成一个按钮。 ── */
button{width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--surface);border:1px solid var(--line2);border-radius:8px;
  padding:8px 10px;margin:0 0 6px;color:var(--fg)}
button:hover:not(:disabled){border-color:var(--dim2);background:#151a21}
button:disabled{opacity:.35;cursor:default}
button b{display:block;font-size:12px;font-weight:500}
button i{display:block;font-style:normal;font-size:10px;color:var(--dim2);
  line-height:1.45;margin-top:1px}
button.stop{background:rgba(255,122,69,.1);border-color:rgba(255,122,69,.4);text-align:center}
button.stop b{color:var(--warn);font-weight:600}
button.tiny{width:auto;padding:4px 9px;font-size:10.5px;color:var(--dim);margin:0}
button.tiny:hover{color:var(--fg)}
button.wide{text-align:center;padding:6px;font-size:10.5px;color:var(--dim)}

/* 翻页页数,缩进挂在「自动翻页抓取」下面 */
.row{display:flex;align-items:center;gap:6px;margin:0 0 6px;padding-left:10px}
.row .lbl{font-size:10.5px;color:var(--dim2);white-space:nowrap}
.row input[type=number]{width:44px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:4px 5px;color:var(--fg);font:11.5px var(--mono);text-align:center}
.row input:focus{outline:none;border-color:rgba(76,141,255,.45)}

/* ── 进度 / 提示 —— 自动的东西必须显示它干了什么,否则等于蒙眼信它 ── */
.prog{font-size:10.5px;line-height:1.5;margin:0 0 9px}
.prog:empty{margin:0}
.prog .bp{color:var(--accent-t);font-family:var(--mono);margin-bottom:3px}
.ml{font-size:10px;color:var(--dim2);font-family:var(--mono);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml.ok{color:var(--ok)} .ml.bad{color:var(--warn)}
.msg{font-size:11px;line-height:1.5;color:var(--dim);margin:0 0 9px}
.msg:empty{margin:0}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--warn)}
#pickinfo{font-size:10px;line-height:1.45;color:var(--dim2);padding-left:10px;margin-bottom:8px}
#pickinfo:empty{margin:0}
#pickinfo .ok{color:var(--ok)}
#pickinfo a{color:var(--accent-t);cursor:pointer;text-decoration:underline}

/* ── 折叠:平时用不到的不占位置 ── */
details{margin:0 0 10px}
summary{font-size:10px;color:var(--dim2);cursor:pointer;padding:4px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ '}
details[open] summary::before{content:'▾ '}
summary:hover{color:var(--dim)}
details .in{border-left:2px solid var(--line2);padding-left:9px;margin-top:5px}
textarea{width:100%;min-height:52px;resize:vertical;background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:7px 8px;color:var(--fg);
  font:10.5px/1.5 var(--mono);margin:0 0 6px}
textarea:focus{outline:none;border-color:rgba(76,141,255,.45)}

/* 一组 = 一件事:标题说清适合什么场景,按钮/开关,以及**它自己的反馈行**。
   反馈跟着操作走,不共用一个公共提示区 —— 共用就看不出提示是谁给的。 */
.grp{border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:8px}
.gh{padding:1px 3px 6px}
.gh b{display:block;font-size:11.5px;font-weight:600}
.gh em{display:block;font-style:normal;font-size:9.5px;color:var(--dim2);
  line-height:1.45;margin-top:1px}
.fb{font-size:10.5px;line-height:1.55;color:var(--dim);padding:0 3px;white-space:pre-line}
.fb:not(:empty){margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--warn)}
.fb .bp{color:var(--accent-t);font-family:var(--mono);margin-bottom:2px}
.grp button{margin-bottom:5px}
.grp label.sw{border:0;background:transparent;padding:3px 4px 2px;margin:0}
.grp .row{padding-left:4px;margin-bottom:4px}

.sep{height:1px;background:var(--line);margin:13px 0 12px}
#svc:not(:empty){margin-top:6px}

/* ── 当前岗位的匹配分 —— 这块是亮点,放最显眼的位置 ── */
.score{border:1px solid rgba(76,141,255,.35);border-radius:9px;background:var(--accent-dim);
  padding:10px 11px;margin:-6px 0 12px}
.score[hidden]{display:none}
.score .fitrow{display:flex;gap:10px;align-items:center}
.score .fit{font:600 27px/1 var(--mono);color:var(--accent-t)}
.score .vd{font-size:10.5px;padding:2px 8px;border-radius:5px;border:1px solid var(--line2);color:var(--dim)}
.score .vd.worth{color:var(--ok);border-color:rgba(92,184,122,.45)}
.score .vd.maybe{color:#bca6ff;border-color:rgba(167,139,250,.45)}
.score .vd.skip{color:var(--warn);border-color:rgba(255,122,69,.45)}
.score .why{font-size:10.5px;color:var(--dim);line-height:1.55;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.score .gate{font-size:10px;margin-top:6px;line-height:1.5;color:var(--dim2)}
.score .gate b{color:var(--warn);font-weight:500}
.score .mt{font-size:9.5px;color:var(--dim2);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.score .mt a{color:var(--accent-t);cursor:pointer;text-decoration:underline}
.score .busy{font-size:11px;color:var(--dim);line-height:1.6}
.score .err{font-size:10.5px;color:var(--warn);line-height:1.55}
</style>

<div class="top">
  <h1>我的岗位库</h1>
  <a id="open">知识库 ↗</a>
</div>

<!-- 抓了多少还没提取 / 提取出多少岗位 / 其中多少拿到了职位描述 -->
<div class="stats">
  <div class="w"><b id="sPend">–</b><span>待提取</span></div>
  <div class="g"><b id="sJobs">–</b><span>岗位</span></div>
  <div><b id="sJd">–</b><span>有描述</span></div>
</div>

<div class="now" id="now"><div class="k">当前页面</div>
  <div class="t" style="color:var(--dim);font-weight:400">读取中…</div></div>

<!-- 当前岗位的匹配分。浏览到岗位详情页就自动出分:
     已提取过的秒出(缓存),第一次见到的自动 提取→打分(两次 AI,落库后免费)。 -->
<div class="score" id="score" hidden></div>

<div class="hd"><b>抓取</b><span>面板开着才抓 · 关掉就完全停</span></div>

<!-- ⓪ 浏览自动存:没有开关 —— 面板开着就是开着。
     以前是一个「打开就存」的勾选框,加上面板开关等于两层开关,
     哪层没开都表现成「没存」,查不清。现在只有一层:面板。 -->
<div class="grp">
  <div class="gh"><b>浏览自动存</b><em>面板开着,你每看一个岗位页就自动存原文;关掉面板就全停</em></div>
  <button class="tiny" id="selftest" style="margin:0 0 0 3px">测一下这条链路</button>
  <div class="fb" id="m2"></div>
</div>

<!-- ① 列表页整页抓 -->
<div class="grp">
  <div class="gh"><b>批量抓取</b><em>在岗位列表页用:逐个打开每个岗位存原文,可自动翻页</em></div>
  <button id="runOne"><b>抓取该页所有岗位列表存入</b><i>逐个打开这一页的每个岗位,存入原文</i></button>
  <label class="sw"><input type="checkbox" id="autonext">
    <span><b>自动翻页</b><i>这一页抓完,自动点「下一页」接着抓</i></span></label>
  <div id="nextbox" hidden>
    <div class="row">
      <span class="lbl">最多</span>
      <input id="pgn" type="number" min="1" max="20" value="5">
      <span class="lbl">页</span>
      <button class="tiny" id="pick">锁定「下一页」按钮</button>
    </div>
    <div id="pickinfo"></div>
  </div>
  <button class="stop" id="stop" hidden><b>停止</b></button>
  <div class="fb" id="m1"></div>
</div>

<!-- ② 手动兜底 -->
<div class="grp">
  <div class="gh"><b>手动存入</b><em>拿不准的页面 —— 上面两个都不对路时,自己点</em></div>
  <button id="save"><b>存这一页</b><i>不管我判它是什么,原样存下来</i></button>
  <div class="fb" id="m3"></div>
</div>

<details id="more">
  <summary>诊断与手动补链接</summary>
  <div class="in">
    <div class="prog" id="astat"></div>
    <button class="wide" id="harvest"
      title="只读已经加载出来的页面,不发任何请求。列表是懒加载的,先往下滚几屏">抓本页岗位链接</button>
    <textarea id="links" placeholder="一行一个:
https://www.zhipin.com/job_detail/xxxx.html"></textarea>
    <button class="wide" id="bgo">逐个打开并存入</button>
    <div class="prog" id="bstat"></div>
  </div>
</details>

<div class="sep"></div>
<!-- 最近存的不在这里铺开 —— 一个入口,打开对应页面看 -->
<button class="wide" id="recent">最近存入 · 全部岗位 ↗</button>
<div class="fb bad" id="svc"></div>

<script src="sidepanel.js"></script>
