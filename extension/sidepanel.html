<meta charset="utf-8">
<style>
:root{--bg:#0a0c0f;--surface:#12151a;--surface2:#161b22;--line:#1e242d;--line2:#242a33;
  --fg:#e9ecf1;--fg-hi:#f2f5f9;--dim:#8b93a1;--dim2:#4e5866;
  --accent:#4c8dff;--accent-t:#7fb0ff;--accent-dim:rgba(76,141,255,.16);
  --warn:#ff7a45;--ok:#5cb87a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.6 -apple-system,"PingFang SC",sans-serif;padding:14px}
h1{margin:0 0 2px;font-size:14px;font-weight:600}
.sub{color:var(--dim2);font-size:10.5px;margin-bottom:14px}

.now{border:1px solid var(--line);border-radius:10px;background:var(--surface);
  padding:12px;margin-bottom:10px}
.now .kind{font-size:10px;color:var(--dim2);letter-spacing:.5px;margin-bottom:6px}
.now .t{font-size:14px;font-weight:600;color:var(--fg-hi);line-height:1.4}
.now .m{font-size:11.5px;color:var(--dim);margin-top:3px}
.now .warn{color:var(--warn);font-size:11.5px}
/* 判定依据 —— 摊开给人看它凭什么认。不摊开就没法发现它在瞎认:
   这个项目栽过一次「界面显示已入库 5,实际全是噪音」。 */
.now .why{font-size:10.5px;line-height:1.55;margin-top:7px;padding-top:7px;
  border-top:1px solid var(--line);color:var(--dim)}
.now .why.yes{color:var(--ok)} .now .why.no{color:var(--dim2)}
.sig{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.sig i{font-style:normal;font-size:9.5px;padding:1px 5px;border-radius:4px;
  border:1px solid var(--line2);color:var(--dim2)}
.sig i.on{border-color:rgba(92,184,122,.4);background:rgba(92,184,122,.1);color:var(--ok)}

button{width:100%;background:var(--accent-dim);color:var(--accent-t);
  border:1px solid rgba(76,141,255,.35);border-radius:8px;padding:9px;
  font-size:12.5px;font-weight:500;cursor:pointer;margin-bottom:7px}
button:hover:not(:disabled){background:rgba(76,141,255,.26)}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;border-color:var(--line2);color:var(--dim);font-weight:400}
button.ghost:hover{color:var(--fg);border-color:var(--dim2)}

.auto{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);
  padding:7px 0 11px}
.auto input{accent-color:var(--accent)}

.msg{font-size:11px;color:var(--dim2);min-height:16px;line-height:1.5;margin-bottom:10px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--warn)}

.hd{display:flex;align-items:baseline;gap:7px;margin:14px 0 7px}
.hd b{font-size:11.5px;font-weight:600}
.hd span{font-size:10px;color:var(--dim2)}
.list{display:flex;flex-direction:column;gap:1px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.it .t{font-size:12px;color:var(--fg);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m{font-size:10px;color:var(--dim2);font-family:var(--mono);margin-top:2px}
.empty{color:var(--dim2);font-size:11px;line-height:1.6;padding:14px 0}
.row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.row .lbl{font-size:11.5px;color:var(--dim);white-space:nowrap}
.row input[type=number]{width:52px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:5px 6px;color:var(--fg);font:12px var(--mono);text-align:center}
.row input:focus{outline:none;border-color:rgba(76,141,255,.45)}
button.inl{width:auto;margin:0 0 0 auto;padding:6px 12px}
#pickinfo{font-size:10.5px;line-height:1.55;margin:-3px 0 8px}
#pickinfo .ok{color:var(--ok)} #pickinfo .dimz{color:var(--dim2)}
#pickinfo a{color:var(--accent-t);cursor:pointer;text-decoration:underline}
#rstat{font-size:11px;margin-bottom:10px}
#rstat .bp{color:var(--accent-t);margin-bottom:4px}
#nextbox{border-left:2px solid var(--line2);padding-left:10px;margin:0 0 8px}

/* 自动存战果 —— 自动的东西必须显示它干了什么,否则等于蒙眼信它 */
#astat{font-size:11px;line-height:1.5;margin:-4px 0 10px}
#astat .ok{color:var(--ok)} #astat .bad{color:var(--warn)}
#astat .dimz{color:var(--dim2)}
.ml{font-size:10px;color:var(--dim2);font-family:var(--mono);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml.ok{color:var(--ok)} .ml.bad{color:var(--warn)}

/* 批量:粘一批链接 */
textarea{width:100%;min-height:64px;resize:vertical;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 9px;color:var(--fg);
  font:11px/1.5 var(--mono);margin-bottom:7px}
textarea:focus{outline:none;border-color:rgba(76,141,255,.45)}
#bstat{display:none;font-size:11px;margin-bottom:10px}
#bstat .bp{color:var(--accent-t);margin-bottom:3px}
</style>

<h1>我的岗位库</h1>
<div class="sub">存在本机 · 不外传</div>

<div class="now" id="now"><div class="kind">当前页面</div>
  <div class="t" style="color:var(--dim)">读取中…</div></div>

<button id="save">存入岗位库</button>
<button class="ghost" id="extract" title="攒一批一起交给 AI —— 比一页一次快也便宜">没有待提取的</button>
<button class="ghost" id="open">打开岗位库 ↗</button>
<label class="auto"><input type="checkbox" id="autochk">
  自动存(打开岗位页就自动存,非岗位页会跳过)</label>
<div class="msg" id="msg"></div>

<div class="hd"><b>自动存</b><span>断在哪一环一眼能看到</span></div>
<div id="astat"></div>

<div class="hd"><b>批量存入</b><span>本页岗位逐个存完,再翻下一页</span></div>

<label class="auto"><input type="checkbox" id="autonext">
  自动下一页(勾上才逐页跑,不勾只做当前这一页)</label>

<!-- 勾上才出现:翻几次 + 指按钮。不勾时这些是多余的,藏起来 -->
<div id="nextbox" hidden>
  <div class="row">
    <span class="lbl">最多翻</span>
    <input id="pgn" type="number" min="1" max="20" value="5">
    <span class="lbl">次</span>
  </div>
  <button class="ghost" id="pick">指一下「下一页」在哪</button>
  <div id="pickinfo"></div>
</div>

<button id="rgo">开始</button>
<div id="rstat"></div>

<div class="hd"><b>手动补链接</b><span>自己粘一批,逐个打开存入</span></div>
<button class="ghost" id="harvest"
  title="只读已经加载出来的页面,不发任何请求。列表是懒加载的,先往下滚几屏">抓本页岗位链接</button>
<textarea id="links" placeholder="点上面「抓本页岗位链接」自动填,
或者自己粘,一行一个:
https://www.zhipin.com/job_detail/xxxx.html"></textarea>
<button class="ghost" id="bgo">开始逐个打开并存入</button>
<div id="bstat"></div>

<div class="hd"><b>已存</b><span id="cnt"></span></div>
<div class="list" id="list"><div class="empty">还没有。打开一个岗位页,点上面「存入」。</div></div>

<script src="sidepanel.js"></script>
