<meta charset="utf-8">
<style>
:root{--bg:#0a0c0f;--surface:#12151a;--surface2:#161b22;--line:#1e242d;--line2:#242a33;
  --fg:#e9ecf1;--fg-hi:#f2f5f9;--dim:#8b93a1;--dim2:#4e5866;
  --accent:#4c8dff;--accent-t:#7fb0ff;--accent-dim:rgba(76,141,255,.16);
  --warn:#ff7a45;--ok:#5cb87a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.55 -apple-system,"PingFang SC",sans-serif;padding:0 13px 22px}

/* ⚠️ 别用负 margin 收紧间距。以前 #astat/-4px、#pickinfo/-3px 这么干过,
   窄侧边栏里文字一换行就压到上一个元素上。要收紧就调上一个元素的 margin-bottom。 */

/* ── 顶部:库里有多少、待提取多少,一眼可见 ── */
.top{position:sticky;top:0;background:var(--bg);padding:12px 0 9px;z-index:5;
  border-bottom:1px solid var(--line);margin-bottom:12px}
.top .r1{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:13px;font-weight:600;flex:1 1 auto}
.chip{font-size:10px;padding:2px 7px;border-radius:20px;white-space:nowrap;
  border:1px solid var(--line2);color:var(--dim)}
.chip.n{font-family:var(--mono)}
.chip.warn{border-color:rgba(255,122,69,.4);background:rgba(255,122,69,.1);color:var(--warn)}
.chip.ok{border-color:rgba(92,184,122,.4);background:rgba(92,184,122,.1);color:var(--ok)}

/* ── 当前页 ── */
.now{border:1px solid var(--line);border-radius:9px;background:var(--surface);
  padding:10px 11px;margin-bottom:9px}
.now .k{font-size:9.5px;letter-spacing:.4px;color:var(--dim2);margin-bottom:4px}
.now .k.yes{color:var(--ok)}
.now .t{font-size:13px;font-weight:600;color:var(--fg-hi);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now .m{font-size:10.5px;color:var(--dim2);margin-top:3px;font-family:var(--mono)}
.now .sig{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.now .sig i{font-style:normal;font-size:9px;padding:1px 5px;border-radius:4px;
  border:1px solid var(--line2);color:var(--dim2)}
.now .sig i.on{border-color:rgba(92,184,122,.35);background:rgba(92,184,122,.09);color:var(--ok)}

/* ── 按钮:同一时刻只有一个主按钮 ── */
button{width:100%;border-radius:8px;cursor:pointer;font-family:inherit;
  background:transparent;border:1px solid var(--line2);color:var(--dim);
  padding:7px;font-size:11.5px;font-weight:400;margin:0 0 6px}
button:hover:not(:disabled){color:var(--fg);border-color:var(--dim2)}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--accent-dim);border-color:rgba(76,141,255,.4);
  color:var(--accent-t);padding:10px;font-size:13px;font-weight:600}
button.go:hover:not(:disabled){background:rgba(76,141,255,.26)}
button.tiny{padding:5px;font-size:10.5px}
button.stop{background:rgba(255,122,69,.12);border-color:rgba(255,122,69,.4);color:var(--warn)}

.hint{font-size:10.5px;color:var(--dim2);line-height:1.5;margin:0 0 8px}
.msg{font-size:11px;line-height:1.5;color:var(--dim);margin:0 0 9px}
.msg:empty{margin:0}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--warn)}

/* ── 选项:缩进一档,表示「属于上面那个按钮」 ── */
.opt{border-left:2px solid var(--line2);padding-left:9px;margin:0 0 9px}
label.sw{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;color:var(--dim);
  cursor:pointer;padding:3px 0}
label.sw input{accent-color:var(--accent);margin:2px 0 0;flex:0 0 auto}
.row{display:flex;align-items:center;gap:5px;margin:5px 0 6px}
.row .lbl{font-size:11px;color:var(--dim2);white-space:nowrap}
.row input[type=number]{width:46px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:4px 5px;color:var(--fg);font:11.5px var(--mono);text-align:center}
.row input:focus{outline:none;border-color:rgba(76,141,255,.45)}

/* ── 进度:自动的东西必须显示它干了什么,否则等于蒙眼信它 ── */
.prog{font-size:11px;line-height:1.5;margin:0 0 9px}
.prog:empty{margin:0}
.prog .bp{color:var(--accent-t);font-family:var(--mono);font-size:10.5px;margin-bottom:3px}
.ml{font-size:10px;color:var(--dim2);font-family:var(--mono);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml.ok{color:var(--ok)} .ml.bad{color:var(--warn)}

/* ── 分组标题 ── */
.hd{display:flex;align-items:baseline;gap:6px;margin:16px 0 6px}
.hd b{font-size:11px;font-weight:600;color:var(--dim)}
.hd span{font-size:9.5px;color:var(--dim2);margin-left:auto;font-family:var(--mono)}

/* ── 折叠:平时不用的东西不该占视觉位置 ── */
details{margin:0 0 8px}
summary{font-size:10.5px;color:var(--dim2);cursor:pointer;padding:4px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ '}
details[open] summary::before{content:'▾ '}
summary:hover{color:var(--dim)}
details .in{border-left:2px solid var(--line2);padding-left:9px;margin:4px 0 0}
textarea{width:100%;min-height:54px;resize:vertical;background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:7px 8px;color:var(--fg);
  font:10.5px/1.5 var(--mono);margin:0 0 6px}
textarea:focus{outline:none;border-color:rgba(76,141,255,.45)}

.list{display:flex;flex-direction:column;gap:3px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.it .t{font-size:11.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m{font-size:9.5px;color:var(--dim2);font-family:var(--mono);margin-top:1px}
.empty{color:var(--dim2);font-size:10.5px;line-height:1.6;padding:10px 0}
#pickinfo{font-size:10px;line-height:1.5;color:var(--dim2)}
#pickinfo .ok{color:var(--ok)}
#pickinfo a{color:var(--accent-t);cursor:pointer;text-decoration:underline}
.sep{height:1px;background:var(--line);margin:14px 0 12px}
</style>

<div class="top">
  <div class="r1">
    <h1>我的岗位库</h1>
    <span class="chip n" id="cJobs">–</span>
    <span class="chip n" id="cPend" hidden></span>
  </div>
</div>

<!-- ① 当前页是什么 -->
<div class="now" id="now"><div class="k">当前页面</div>
  <div class="t" style="color:var(--dim);font-weight:400">读取中…</div></div>

<!-- ② 主操作 —— **跟着当前页变,同一时刻只有一个大按钮**。
     以前 5 个平级按钮并排,看不出该点哪个。 -->
<button class="go" id="primary">…</button>
<div class="hint" id="phint"></div>

<!-- ③ 批量的选项 —— 只在列表页显示(详情页没有「下一页」可翻) -->
<div class="opt" id="bulkopt" hidden>
  <label class="sw"><input type="checkbox" id="autonext">
    <span>抓完自动翻下一页</span></label>
  <div id="nextbox" hidden>
    <div class="row">
      <span class="lbl">最多</span>
      <input id="pgn" type="number" min="1" max="20" value="5">
      <span class="lbl">页</span>
    </div>
    <button class="tiny" id="pick">指一下「下一页」在哪</button>
    <div id="pickinfo"></div>
  </div>
</div>
<div class="prog" id="rstat"></div>
<div class="msg" id="msg"></div>

<!-- ④ 次要操作 -->
<button id="save" hidden>只存这一页的原文</button>
<button id="extract" disabled>没有待提取的</button>
<button id="open">打开岗位库 ↗</button>

<div class="sep"></div>

<!-- ⑤ 平时不用的:开关、诊断、手动粘链接 -->
<details id="more">
  <summary>设置与诊断</summary>
  <div class="in">
    <label class="sw"><input type="checkbox" id="autochk">
      <span>浏览时自动存 —— 打开岗位页就顺手存下原文</span></label>
    <div class="prog" id="astat"></div>

    <div class="hd"><b>手动粘链接</b></div>
    <button class="tiny" id="harvest"
      title="只读已经加载出来的页面,不发任何请求">抓本页岗位链接</button>
    <textarea id="links" placeholder="一行一个:
https://www.zhipin.com/job_detail/xxxx.html"></textarea>
    <button class="tiny" id="bgo">逐个打开并存入</button>
    <div class="prog" id="bstat"></div>
  </div>
</details>

<div class="hd"><b>最近存的</b><span id="cnt"></span></div>
<div class="list" id="list"><div class="empty">还没有岗位。</div></div>

<script src="sidepanel.js"></script>
